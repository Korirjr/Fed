<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ulu — 30s ad</title>
<style>
  @font-face { font-family: RX300; src: url(fonts/readex-pro-arabic-300-normal.woff2); unicode-range: U+0600-06FF,U+0750-077F,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC; }
  @font-face { font-family: RX300; src: url(fonts/readex-pro-latin-300-normal.woff2); unicode-range: U+0000-00FF,U+2000-206F,U+2190-21FF; }
  @font-face { font-family: RX500; src: url(fonts/readex-pro-arabic-500-normal.woff2); unicode-range: U+0600-06FF,U+0750-077F,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC; }
  @font-face { font-family: RX500; src: url(fonts/readex-pro-latin-500-normal.woff2); unicode-range: U+0000-00FF,U+2000-206F,U+2190-21FF; }
  @font-face { font-family: RX700; src: url(fonts/readex-pro-arabic-700-normal.woff2); unicode-range: U+0600-06FF,U+0750-077F,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC; }
  @font-face { font-family: RX700; src: url(fonts/readex-pro-latin-700-normal.woff2); unicode-range: U+0000-00FF,U+2000-206F,U+2190-21FF; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  #gl { position: absolute; left: -99999px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="out"></canvas>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uV;     // 1 = vertical 9:16, 0 = horizontal 16:9
#define PI 3.14159265

float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
vec2  h22(vec2 p){ float n = h21(p); return vec2(n, h21(p+n+17.17)); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), u.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<5;i++){ v += a*noise(p); p = m*p; a *= .5; } return v; }
float h31(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm3(vec3 p){ float v = 0., a = .5; for(int i=0;i<5;i++){ v += a*noise3(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return v; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float ease(float a, float b, float t){ return smoothstep(a, b, t); }

// Ulu brand gradient: violet -> coral -> amber -> sky
vec3 brand(float x){
  x = fract(x)*4.;
  vec3 c0 = vec3(.48,.34,1.), c1 = vec3(1.,.28,.45), c2 = vec3(1.,.68,.25), c3 = vec3(.22,.68,1.);
  if(x < 1.) return mix(c0, c1, smoothstep(0.,1.,x));
  if(x < 2.) return mix(c1, c2, smoothstep(1.,2.,x));
  if(x < 3.) return mix(c2, c3, smoothstep(2.,3.,x));
  return mix(c3, c0, smoothstep(3.,4.,x));
}

float MINR(){ return min(uRes.x, uRes.y); }

vec3 stars(vec2 p, float t){
  vec3 c = vec3(0);
  for(int L=0; L<3; L++){
    float fl = float(L);
    float s = 60. + fl*55.;
    vec2 q = p*s + fl*17.3;
    vec2 id = floor(q), f = fract(q) - .5;
    float r = h21(id + fl*7.1);
    if(r > .91){
      vec2 o = (h22(id + 3.1) - .5)*.7;
      float dp = length(f - o)*MINR()/s;
      float b = (r - .91)/.09;
      float tw = .65 + .35*sin(t*(1.5 + r*4.) + r*60.);
      vec3 tint = mix(vec3(.7,.8,1.), vec3(1.,.88,.78), h21(id+9.));
      c += tint*(.25 + b*b)*tw*(exp(-dp*dp*.8) + .08*exp(-dp*.8)*b)*(1.3 - fl*.3);
    }
  }
  return c;
}

vec3 earth(vec2 p, vec2 c, float R, float spin, float tilt, float t, float aur, float sun, out float m){
  vec2 d = (p - c)/R;
  float r = length(d);
  float px = 1.5/(MINR()*R);
  m = smoothstep(1. + px, 1. - px, r);
  vec3 col = vec3(0);
  float ang = atan(d.x, d.y);
  float hs = (r - 1.)*R;
  if(r < 1. + px){
    float z = sqrt(max(1. - r*r, 0.));
    vec3 n = vec3(d.x, d.y, z);
    n.yz = rot(tilt)*n.yz;
    n.xz = rot(spin)*n.xz;
    float cont = fbm3(n*2.1 + vec3(3.1, 1.2, 7.7));
    float land = smoothstep(.48, .53, cont);
    float coast = smoothstep(.47, .5, cont) - smoothstep(.5, .53, cont);
    float region = smoothstep(.4, .75, fbm3(n*7. + 11.));
    float pts  = pow(noise3(n*170.), 7.)*5. + pow(noise3(n*430. + 3.), 9.)*7.;
    float glow = pow(fbm3(n*28.), 3.)*.35;
    float city = (land*region*(pts + glow) + coast*region*pts*2.)*.95;
    float limb = smoothstep(0., .55, z);
    vec3 surf = mix(vec3(.004,.008,.024), vec3(.009,.012,.02), land);
    col = surf*(.5 + limb);
    col += vec3(1., .6, .28)*city*limb*(1. - sun*.5);
    // sunrise crescent along the top limb
    col += vec3(1., .5, .3)*sun*exp(-(1. - r)*R*60.)*exp(-abs(ang)*2.)*1.4;
    col += vec3(.35, .45, 1.)*sun*exp(-(1. - r)*R*22.)*exp(-abs(ang)*1.2)*.2;
    col *= m;
  }
  col += vec3(.2, .42, 1.)*exp(-abs(hs)*48.)*.38;
  col += vec3(.25, .9, .7)*exp(-pow((hs - .008)/.003, 2.))*.18;
  vec3 atmC = mix(vec3(1., .45, .3), vec3(.4, .45, 1.), smoothstep(0., .6, abs(ang)));
  col += atmC*sun*exp(-abs(hs)*mix(28., 60., smoothstep(0., .6, abs(ang))))*exp(-abs(ang)*2.4)*1.3;
  if(aur > 0. && hs > -.01 && hs < .3){
    float base = .01 + .03*fbm(vec2(ang*2.5 + t*.03, 3.));
    float v = hs - base;
    float band = smoothstep(.3, .75, fbm(vec2(ang*4.5 - t*.04, t*.07)));
    float rays = .55 + .45*noise(vec2(ang*380. + fbm(vec2(ang*10., t*.2))*20., t*.6));
    float prof = smoothstep(-.004, .006, v)*exp(-max(v, 0.)*mix(9., 22., band));
    vec3 ac = mix(vec3(.2, 1., .6), vec3(.6, .3, 1.), smoothstep(.02, .12, v));
    col += ac*band*rays*prof*smoothstep(1.3, .4, abs(ang))*aur*(1. - m*.7);
  }
  return col;
}

vec3 fluid(vec2 p, float t){
  p += vec2(-t*.05, .02*t);
  vec2 q = vec2(fbm(p*1.1 + vec2(0., t*.10)), fbm(p*1.1 + vec2(5.2, 1.3) - t*.08));
  vec2 r = vec2(fbm(p*1.4 + 3.2*q + vec2(1.7, 9.2) + t*.13), fbm(p*1.4 + 3.2*q + vec2(8.3, 2.8) - t*.11));
  float f = fbm(p*1.7 + 3.6*r);
  float fil = pow(smoothstep(.3, .9, f), 2.2);
  return brand(r.x*2. + q.y*1.2 + t*.03)*(fil*2.4 + .06*f);
}

vec3 bokeh(vec2 p, float t){
  vec3 c = vec3(0);
  for(int L=0;L<2;L++){
    float fl = float(L);
    float s = 3.5 + fl*4.;
    vec2 q = (p + vec2(t*(.02 + .02*fl), -t*.015))*s + fl*11.;
    vec2 id = floor(q), f = fract(q) - .5;
    float r = h21(id + fl*3.);
    if(r < .55) continue;
    vec2 o = (h22(id + fl) - .5)*.5;
    float d = length(f - o);
    float size = .08 + .1*h21(id + 5.);
    float b = smoothstep(size, size*.85, d)*(.5 + .5*smoothstep(size*.3, size, d));
    c += brand(r*2.3 + fl*.4)*b*.16*(.6 + .4*sin(t*.8 + r*30.));
  }
  return c;
}

vec3 glare(vec2 p, vec2 s, float amt, vec3 tint){
  vec2 d = p - s; float r = length(d);
  vec3 c = vec3(0);
  c += vec3(1., .95, .88)*exp(-r*r*2400.)*5.;
  c += tint*.02/(r*r*30. + .02)*.35;
  c += tint*exp(-r*4.5)*.35;
  c += vec3(.6, .7, 1.)*exp(-abs(d.y)*260.)*exp(-abs(d.x)*1.5)*1.;
  float a = atan(d.y, d.x);
  float rays = pow(noise(vec2(a*14., 1.)), 3.)*.6 + pow(noise(vec2(a*37., 4.)), 4.)*.5;
  c += tint*rays*exp(-r*3.2)*.5*step(-.02, d.y + .05);
  return c*amt;
}

// ---------------------------------------------------------------- shared camera (mirrored in JS)
void earthCam(float t, out vec2 C, out float R){
  float rise = ease(2.8, 6.2, t);
  C = mix(vec2(.40, -.30), vec2(0., -.30), uV);
  R = mix(.70, .56, uV);
  C.y -= (1. - rise)*1.6;
  R *= 1. + .04*t/10.;
}
vec2 hubOf(vec2 C, float R){ return C + R*vec2(-.14, .42); }

// ---------------------------------------------------------------- acts
vec3 orbitAct(vec2 p, float t){
  vec2 C; float R; earthCam(t, C, R);
  vec2 hub = hubOf(C, R);
  float dive = ease(9.3, 11.2, t);
  float z = 1. + pow(dive, 2.2)*18.;
  vec2 pe = (p - hub)/z + hub;
  float m;
  vec3 col = earth(pe, C, R, 2.2 + t*.02, -.45, t, .4, 0., m);
  col += stars(pe*(1. + .015*t), t)*(1. - m);

  // the spark: one moment, beating like a heart (96 bpm)
  float sparkOn = ease(.2, 1.4, t)*(1. - ease(4.4, 4.9, t));
  if(sparkOn > 0.){
    float beat = fract(t/.625);
    float hb = .55 + .45*(exp(-beat*9.) + .6*exp(-max(beat - .22, 0.)*12.)*step(.22, beat));
    vec2 sp = mix(vec2(0., .06), hub, pow(ease(3.2, 4.8, t), 1.6));
    vec2 d = p - sp; float r = length(d);
    float k = sparkOn*hb*(1. - .5*ease(3.2, 4.8, t));
    col += vec3(1., .9, .8)*exp(-r*r*9000.)*4.*k;
    col += brand(.3)*.004/(r*r + .004)*.5*k;
    col += vec3(1., .55, .45)*exp(-abs(d.y)*400.)*exp(-abs(d.x)*4.)*.7*k;
  }
  // landing ripple on the globe
  float lr = max(t - 4.75, 0.);
  col += brand(.35)*exp(-pow((length(p - hub) - lr*.25)/.008, 2.))*exp(-lr*1.6)*step(4.75, t)*1.2;

  // dive warp: radial light streaks in brand colours
  vec2 dv = p - hub; float rr = length(dv); float an = atan(dv.y, dv.x);
  float wl = pow(noise(vec2(an*60., log(rr + .001)*1.5 - t*8.)), 6.)*3.*smoothstep(.0, .2, rr);
  col += brand(an*.32 + t*.05)*wl*dive*dive*1.8;
  col *= 1. + dive*1.2;
  col += vec3(1., .9, .95)*exp(-pow((t - 11.15)*5., 2.))*1.4;
  return col;
}

vec3 appAct(vec2 p, float t){
  float tf = t - 11.;
  vec3 col = vec3(.012, .01, .03);
  col += fluid(p*1.05, tf)*.32;
  col += bokeh(p, tf);
  vec2 ph = mix(vec2(.38, 0.), vec2(0., -.10), uV);
  col += brand(.2 + .03*tf)*exp(-length((p - ph)*vec2(1., .7))*3.2)*.22;
  return col;
}

float horizonY(float t){ return mix(-.20, -.34, uV) - ease(21., 25.3, t)*1.7; }

vec3 skyAct(vec2 p, float t){
  float hy = horizonY(t);
  float h = p.y - hy;
  vec3 col;
  vec3 zen = vec3(.008, .01, .035), mid = vec3(.12, .05, .24), hor = vec3(1., .40, .30);
  if(h > 0.){
    col = mix(hor, mid, smoothstep(0., .22, h));
    col = mix(col, zen, smoothstep(.18, .95, h));
    col += vec3(1., .52, .25)*exp(-length(vec2(p.x*.55, h))*5.)*.75;
    float cl = fbm(vec2(p.x*2.2 + t*.015, h*8.5 + 4.));
    float band = smoothstep(.04, .12, h)*smoothstep(.42, .18, h);
    float cm = smoothstep(.5, .72, cl)*band;
    col = mix(col, col*.35 + vec3(.9, .4, .35)*.12*smoothstep(.3, .05, h), cm*.85);
    col += stars(vec2(p.x, h), t)*smoothstep(.35, 1.1, h);
  } else {
    col = vec3(.01, .007, .014);
    float lights = pow(noise(vec2(p.x*260., h*140.)), 14.)*3. + pow(noise(vec2(p.x*90., h*60.)), 8.)*.6;
    col += vec3(1., .65, .35)*lights*smoothstep(-.14, -.005, h);
    col += vec3(1., .45, .3)*exp(h*40.)*.25;
  }
  return col;
}

vec3 endAct(vec2 p, float t){
  vec2 C = vec2(0., mix(-1.95, -1.78, uV));
  float R = mix(1.6, 1.25, uV);
  float rise = ease(25., 29., t);
  float m;
  vec3 col = earth(p, C, R, 3.1 + t*.015, -1.05, t, .25, .45 + rise*.9, m);
  col += stars(p, t)*(1. - m);
  vec2 sunP = vec2(0., C.y + R - .03 + rise*.045);
  float occl = smoothstep(-.01, .02, length(sunP - C) - R);
  col += glare(p, sunP, (.35 + rise*.7)*mix(.4, 1., occl), vec3(1., .55, .4))*(1. - m*.9);
  float fl = exp(-pow((t - 25.)*4.5, 2.));
  col += mix(brand(.3), vec3(1.), .4)*fl*.35;
  float ringR = max(t - 25., 0.)*1.3;
  col += brand(.45)*exp(-pow((length(p - vec2(0., .1)) - ringR)/.02, 2.))*exp(-max(t - 25., 0.)*1.5)*step(25., t)*.8;
  return col;
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 p = (fc - .5*uRes)/MINR();
  vec2 uv = fc/uRes;
  float t = uT;
  vec3 col = vec3(0);
  float wO = 1. - ease(11.0, 11.35, t);
  float wA = ease(11.0, 11.35, t)*(1. - ease(20.0, 20.6, t));
  float wS = ease(19.9, 20.4, t)*(1. - ease(24.7, 25.2, t));
  float wE = ease(24.7, 25.1, t);
  if(wO > 0.) col += orbitAct(p, t)*wO;
  if(wA > 0.) col += appAct(p, t)*wA;
  if(wS > 0.) col += skyAct(p, t)*wS;
  if(wE > 0.) col += endAct(p, t)*wE;
  col *= ease(0., .8, t);
  col = 1. - exp(-col*1.15);
  col = pow(col, vec3(.9));
  vec2 vv = uv - .5;
  col *= 1. - .5*dot(vv, vv);
  col += (h21(fc + fract(t*7.13)*517.) - .5)*.02;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}
</script>

<script>
// ============================================================== setup
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1080), H = +(Q.get('h') || 1920);
const V = H > W ? 1 : 0;
const S0 = Math.min(W, H), S = S0 / 1080;
const FPS = 30;
const X = x => W / 2 + x * S0, Y = y => H / 2 - y * S0;

const glc = document.getElementById('gl'); glc.width = W; glc.height = H;
const out = document.getElementById('out'); out.width = W; out.height = H;
const gl = glc.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes'), uT = gl.getUniformLocation(prog, 'uT'), uV = gl.getUniformLocation(prog, 'uV');
gl.viewport(0, 0, W, H);
const ctx = out.getContext('2d');

// ============================================================== utils
const clamp01 = x => Math.max(0, Math.min(1, x));
const ss = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = x => { x = clamp01(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const BEAT = 60 / 96;
const BRAND = ['#7B57FF', '#FF4873', '#FFAD40', '#38ADFF', '#C04BFF'];
const EMOJI = "'Noto Color Emoji'";
const font = (w, px) => `${px}px RX${w}, ${EMOJI}`;

// glow sprites for additive particles
const sprites = BRAND.concat(['#ffffff']).map(c => {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(.18, c); gr.addColorStop(.45, c + '55'); gr.addColorStop(1, c + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
});
function glowDot(x, y, r, ci, a){ ctx.globalAlpha = a; ctx.drawImage(sprites[ci % sprites.length], x - r, y - r, 2 * r, 2 * r); }

function brandGrad(c, x0, y0, x1, y1){
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#7B57FF'); g.addColorStop(.5, '#FF4873'); g.addColorStop(1, '#FFAD40'); return g;
}

function heart(c, x, y, s){
  c.beginPath(); c.moveTo(x, y + s * .35);
  c.bezierCurveTo(x - s * .9, y - s * .25, x - s * .45, y - s * .95, x, y - s * .45);
  c.bezierCurveTo(x + s * .45, y - s * .95, x + s * .9, y - s * .25, x, y + s * .35);
  c.fill();
}

// tapered limb segment
function limb(c, x0, y0, x1, y1, w0, w1){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  c.beginPath();
  c.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2); c.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
  c.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); c.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2); c.closePath(); c.fill();
  c.beginPath(); c.arc(x0, y0, w0 / 2, 0, 7); c.fill();
  c.beginPath(); c.arc(x1, y1, w1 / 2, 0, 7); c.fill();
}
// silhouette person. fx,fy = feet; h = height px; arms: {l:[shoulderAngle, elbowBend], r:[...]}; angle 0 = down, PI = up
function person(c, fx, fy, h, o){
  const ys = fy - .80 * h, hy = fy - .47 * h, sw = .118 * h;
  const lean = o.lean || 0, step = o.step || 0;
  const hx = fx + lean * h * .05;
  // legs: thigh -> knee -> ankle, plus feet
  for(const side of [-1, 1]){
    const hpx = fx + side * .052 * h, kx = fx + side * (.06 * h) + side * step * h * .02, ky = fy - .25 * h;
    const ax = fx + side * .068 * h - side * step * h * .035, ay = fy - .025 * h;
    limb(c, hpx, hy, kx, ky, .1 * h, .066 * h);
    limb(c, kx, ky, ax, ay, .062 * h, .04 * h);
    c.beginPath(); c.ellipse(ax + side * .018 * h, fy - .012 * h, .045 * h, .02 * h, 0, 0, 7); c.fill();
  }
  // torso: shoulders -> waist -> hips
  c.beginPath();
  c.moveTo(hx - sw * .45, ys - .022 * h);
  c.bezierCurveTo(hx - sw * .9, ys - .02 * h, hx - sw * 1.05, ys + .0 * h, hx - sw * 1.0, ys + .05 * h);
  c.bezierCurveTo(hx - sw * .95, ys + .12 * h, fx - .08 * h, ys + .17 * h, fx - .082 * h, ys + .23 * h);
  c.bezierCurveTo(fx - .085 * h, hy - .03 * h, fx - .108 * h, hy, fx - .1 * h, hy + .035 * h);
  c.lineTo(fx + .1 * h, hy + .035 * h);

function textIn(str, x, y, px, w, t, tin, tout, o = {}){
  const inD = o.inD || .7, outD = o.outD || .45;
  const a = ss(tin, tin + inD, t) * (1 - ss(tout, tout + outD, t));
  if(a <= .002) return 0;
  const pin = easeOut((t - tin) / inD), pout = ss(tout, tout + outD, t);
  ctx.save();
  ctx.globalAlpha = a * (o.alpha ?? 1);
  const blur = ((1 - pin) * (o.blur ?? 14) + pout * 10) * S;
  ctx.filter = blur > .3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  ctx.font = font(w, px * S);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.direction = o.dir || 'rtl';
  if(o.track) ctx.letterSpacing = `${(o.track + (1 - pin) * (o.trackIn || 0)) * px * S}px`;
  const rise = o.rise ?? 26;
  ctx.translate(x, y + ((1 - pin) * rise - pout * rise * .6) * S);
  const sc = 1 + (1 - pin) * (o.scale ?? .04); ctx.scale(sc, sc);
  if(o.glow){ ctx.shadowColor = o.glow; ctx.shadowBlur = (o.glowR || 28) * S; }
  ctx.fillStyle = o.fill || '#fff';
  ctx.fillText(str, 0, 0);
  if(o.sweep){
    const k = (t - o.sweep) / 1.1;
    if(k > 0 && k < 1){
      const m = ctx.measureText(str).width;
      const sx = -m / 2 - 200 * S + (m + 400 * S) * (1 - k);
      const g = ctx.createLinearGradient(sx - 120 * S, 0, sx + 120 * S, 0);
      g.addColorStop(0, 'rgba(255,230,210,0)'); g.addColorStop(.5, 'rgba(255,245,235,.95)'); g.addColorStop(1, 'rgba(255,230,210,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0; ctx.fillStyle = g; ctx.fillText(str, 0, 0);
    }

}

// ============================================================== Act 1–2: globe connections (mirrors shader camera)
function earthCam(t){
  const rise = ss(2.8, 6.2, t);
  const C = V ? [0, -.30] : [.40, -.30];
  let R = V ? .56 : .70;
  C[1] -= (1 - rise) * 1.6; R *= 1 + .04 * t / 10;
  return { C, R, spin: 2.2 + t * .02, tilt: -.45 };
}
function fwd(v, e){ // view -> world (tilt then spin), as in shader
  let [x, y, z] = v; const ct = Math.cos(e.tilt), st = Math.sin(e.tilt);
  const y1 = ct * y + st * z, z1 = -st * y + ct * z;
  const cs = Math.cos(e.spin), sn = Math.sin(e.spin);
  return [cs * x + sn * z1, y1, -sn * x + cs * z1];
}
function inv(m, e){
  let [x, y, z] = m; const cs = Math.cos(e.spin), sn = Math.sin(e.spin);
  const x1 = cs * x - sn * z, z1 = sn * x + cs * z;
  const ct = Math.cos(e.tilt), st = Math.sin(e.tilt);
  return [x1, ct * y - st * z1, st * y + ct * z1];
}
function proj(m, hgt, e){
  const v = inv(m, e); const r = 1 + hgt;
  const vis = v[2] > 0 || (v[0] * v[0] + v[1] * v[1]) * r * r > 1;
  return [X(e.C[0] + e.R * v[0] * r), Y(e.C[1] + e.R * v[1] * r), vis, v[2]];
}
const norm = v => { const l = Math.hypot(...v); return v.map(a => a / l); };
function slerp(a, b, k){
  const d = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2])); const om = Math.acos(d);
  if(om < 1e-4) return a; const s = Math.sin(om);
  return a.map((ai, i) => (Math.sin((1 - k) * om) * ai + Math.sin(k * om) * b[i]) / s);
}
const refCam = earthCam(7.5);
const hubWorld = fwd(norm([-.14, .42, Math.sqrt(1 - .14 * .14 - .42 * .42)]), earthCam(4.8));
const cities = [];
for(let i = 0; i < 16; i++){
  const a = rnd(i * 3.1) * Math.PI * 2, r = .25 + .6 * Math.sqrt(rnd(i * 7.7));
  const vx = Math.cos(a) * r, vy = Math.sin(a) * r * .85 + .08;
  cities.push(fwd(norm([vx, vy, Math.sqrt(Math.max(.05, 1 - vx * vx - vy * vy))]), refCam));
}

const ARCS = [];
const ARC_T = [5.0, 5.25, 5.55, 5.9, 6.2, 6.55, 6.85, 7.15, 7.5, 7.8, 8.1, 8.4, 8.7, 9.0];
ARC_T.forEach((ts, i) => {

});

function avatar(c, x, y, r, ci, seed){

function drawGlobeLayer(t){
  const fade = ss(4.9, 5.3, t) * (1 - ss(9.4, 9.9, t));
  if(fade <= 0) return;
  const e = earthCam(t);
  ctx.save();
  ctx.lineCap = 'round';
  for(const A of ARCS){
    const k = (t - A.ts) / A.dur;
    if(k <= 0) continue;
    const head = easeInOut(Math.min(k, 1));
    const om = Math.acos(Math.max(-1, Math.min(1, A.from[0] * A.to[0] + A.from[1] * A.to[1] + A.from[2] * A.to[2])));
    const N = 40; const pts = [];
    for(let i = 0; i <= N; i++){
      const s = i / N; if(s > head) break;
      pts.push(proj(slerp(A.from, A.to, s), Math.sin(Math.PI * s) * (.12 + .25 * om / Math.PI), e));
    }
    const persist = Math.max(.18, 1 - Math.max(0, k - 1) * .6);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = BRAND[A.ci]; ctx.shadowColor = BRAND[A.ci]; ctx.shadowBlur = 14 * S;
    for(let i = 1; i < pts.length; i++){
      if(!pts[i][2] || !pts[i - 1][2]) continue;
      const s = i / N, tail = clamp01(1 - (head - s) / .45);
      ctx.globalAlpha = fade * (.25 * persist + .75 * tail * (k < 1.4 ? 1 : persist));
      ctx.lineWidth = (1.4 + 2.2 * tail) * S;
      ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    if(k < 1 && pts.length){ const h = pts[pts.length - 1]; if(h[2]) glowDot(h[0], h[1], 16 * S, A.ci, fade); }
    // arrival: ripple + someone pops up
    if(k >= 1){
      const [x, y, vis, vz] = proj(A.to, 0, e);
      if(!vis || vz < .15) continue;
      const age = (t - A.ts - A.dur);
      ctx.globalAlpha = fade * Math.exp(-age * 2.2);
      ctx.strokeStyle = BRAND[A.ci]; ctx.lineWidth = 2 * S;
      ctx.beginPath(); ctx.ellipse(x, y, (8 + age * 60) * S, (8 + age * 60) * S * Math.max(.3, vz), 0, 0, Math.PI * 2); ctx.stroke();
      glowDot(x, y, 12 * S, A.ci, fade);
      ctx.globalCompositeOperation = 'source-over';
      const pop = backOut(age / .45) * fade;
      if(pop > .01){
        const r = 21 * S * pop, ay = y - 42 * S * pop;
        ctx.globalAlpha = Math.min(1, fade * 1.2);
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2 * S;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, ay + r); ctx.stroke();
        avatar(ctx, x, ay, r, A.ci, ARCS.indexOf(A));
        if(V === 0 || ARCS.indexOf(A) % 2 === 0){
          ctx.font = font(500, 15 * S); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.85)';
          ctx.fillText(NAMES[ARCS.indexOf(A)], x, ay - r - 12 * S);
        }
      }
    }
  }
  ctx.restore();
}

    bg.addColorStop(0, `rgba(255,${150 + 60 * rnd(i)},90,.35)`); bg.addColorStop(.8, 'rgba(255,170,90,.15)'); bg.addColorStop(1, 'rgba(255,170,90,0)');
    c.fillStyle = bg; c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.fill();
  }
  // ring light
  const cx = w * .5, cy = h * .37;
  c.save(); c.strokeStyle = '#fff6ea'; c.lineWidth = w * .035; c.shadowColor = 'rgba(255,240,220,1)'; c.shadowBlur = w * .08;
  c.beginPath(); c.arc(cx, cy, w * .33, 0, Math.PI * 2); c.stroke(); c.restore();
  const bob = Math.sin(t * 5.3) * .6 + Math.sin(t * 2.1) * .4;
  glowFigure(c, ['rgba(255,225,190,.95)'], w * .05, [0], '#0c0708', f => bust(f, cx, cy + h * .01, w * .2, bob));
  // header
  c.fillStyle = '#ff2d55'; c.beginPath(); c.roundRect(w * .72, h * .065, w * .23, h * .036, h * .01); c.fill();
  c.fillStyle = '#fff'; c.font = font(700, w * .04); c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'rtl';
  c.fillText('مباشر', w * .815, h * .084);
  c.globalAlpha = .5 + .5 * Math.sin(t * 8); c.beginPath(); c.arc(w * .925, h * .083, w * .012, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
  const viewers = Math.floor(1200 + Math.pow(clamp01(lt / 2.6), 1.6) * 47000);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.roundRect(w * .44, h * .065, w * .26, h * .036, h * .01); c.fill();
  c.fillStyle = '#fff'; c.font = font(500, w * .036); c.direction = 'ltr';
  c.fillText('👁 ' + (viewers / 1000).toFixed(1) + 'K', w * .57, h * .084);
  avatar(c, w * .1, h * .083, w * .045, 2, 1);
  // comments rising
  const per = .32; const n = Math.floor(lt / per);
  c.textAlign = 'right'; c.direction = 'rtl';
  for(let j = 0; j < 5; j++){
    const idx = n - j; if(idx < 0) continue;
    const age = lt - idx * per; const slide = easeOut(age / .25);
    const y = h * .88 - (j + (1 - slide) * -0 ) * h * .052 - (1 - slide) * h * .01;
    c.globalAlpha = (1 - j / 5) * slide;
    const [nm, tx] = COMMENTS[idx % COMMENTS.length];
    c.font = font(700, w * .036); const nw = c.measureText(nm + '  ').width;
    c.font = font(300, w * .036); const tw = c.measureText(tx).width;
    c.fillStyle = 'rgba(0,0,0,.38)'; c.beginPath(); c.roundRect(w * .9 - nw - tw - w * .04, y - h * .02, nw + tw + w * .12, h * .04, h * .02); c.fill();
    avatar(c, w * .93, y, w * .028, idx % 4, idx);
    c.fillStyle = '#ffd38a'; c.font = font(700, w * .036); c.fillText(nm, w * .885, y);
    c.fillStyle = '#fff'; c.font = font(300, w * .036); c.fillText(tx, w * .885 - nw, y);
  }
  c.globalAlpha = 1;
  // heart stream
  for(let i = 0; i < 40; i++){
    const tb = i * .09; const age = lt - tb;
    if(age < 0 || age > 1.6) continue;
    c.globalAlpha = Math.min(1, (1.6 - age) * 1.5);
    c.fillStyle = BRAND[[1, 2, 4, 1, 0][i % 5]];
    heart(c, w * (.1 + .05 * Math.sin(age * 4 + i)) + age * w * .03 * (rnd(i) - .3), h * .92 - age * h * .35, w * (.035 + .02 * rnd(i + 3)));
  }
  c.globalAlpha = 1;
}

const scr = document.createElement('canvas');
scr.width = Math.round(PH.w * .93); scr.height = Math.round(PH.h * .965);
const sctx = scr.getContext('2d');

function drawPhone(t){
  const enter = easeOut((t - 11.2) / 1.1);
  const exit = ss(19.75, 20.5, t);
  if(t < 11.2 || exit >= 1) return;
  // screen content with vertical swipes between modes
  const sw = scr.width, shh = scr.height;
  sctx.clearRect(0, 0, sw, shh);
  const swipe = k => easeInOut(k);
  const k1 = swipe((t - 14.85) / .4), k2 = swipe((t - 17.35) / .4);
  const off = (k1 + k2) * shh;
  const drawMode = (i, y) => {
    if(y > shh || y < -shh) return;
    sctx.save(); sctx.translate(0, y);
    sctx.beginPath(); sctx.rect(0, 0, sw, shh); sctx.clip();
    if(i === 0) storyScreen(sctx, sw, shh, t - 11.2);
    if(i === 1) reelsScreen(sctx, sw, shh, t - 15.0, t);
    if(i === 2) liveScreen(sctx, sw, shh, t - 17.5, t);
    sctx.restore();
  };
  for(let i = 0; i < 3; i++) drawMode(i, i * shh - off);

  const bobY = Math.sin(t * 1.3) * 8 * S;
  const rotA = Math.sin(t * .7) * .025 + (1 - enter) * .2;
  const sc = (.88 + .12 * enter) * (1 + Math.pow(exit, 2) * 2.4);
  ctx.save();
  ctx.globalAlpha = clamp01(enter * 1.4) * (1 - ss(20.05, 20.5, t));
  ctx.translate(PH.x, PH.y + bobY + (1 - enter) * 300 * S); ctx.rotate(rotA); ctx.scale(sc, sc);
  const w = PH.w, h = PH.h, r = w * .14;
  // brand halo
  ctx.shadowColor = 'rgba(255,72,115,.55)'; ctx.shadowBlur = 90 * S;
  ctx.fillStyle = '#07060c'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.shadowBlur = 0;
  // titanium rim
  const rim = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  rim.addColorStop(0, '#8e8a9e'); rim.addColorStop(.3, '#2b2933'); rim.addColorStop(.6, '#5f5b6e'); rim.addColorStop(1, '#1c1b22');
  ctx.strokeStyle = rim; ctx.lineWidth = w * .016; ctx.stroke();
  // screen
  ctx.save(); ctx.beginPath(); ctx.roundRect(-sw / 2, -shh / 2, sw, shh, r * .82); ctx.clip();
  ctx.drawImage(scr, -sw / 2, -shh / 2);
  const gl2 = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h * .1);
  gl2.addColorStop(0, 'rgba(255,255,255,.10)'); gl2.addColorStop(.5, 'rgba(255,255,255,0)'); gl2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl2; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(-w * .14, -shh / 2 + h * .014, w * .28, h * .03, h * .015); ctx.fill();
  ctx.restore();
}

function drawAppText(t){
  const lx = V ? X(0) : X(-.44);
  const ly = V ? Y(.73) : Y(.07);
  const sub = V ? Y(.635) : Y(-.06);
  const kick = V ? Y(.81) : Y(.19);
  const labels = [
    ['STORIES', 'ستوري', 'شارك يومك بلحظة', 12.5, 14.75],
    ['REELS', 'ريلز', 'إبداعك يوصل للملايين', 15.0, 17.25],
    ['LIVE', 'لايف', 'بث مباشر. تفاعل حقيقي.', 17.5, 19.8],
  ];
  for(const [en, ar, line, a, b] of labels){
    textIn(en, lx, kick, 26, 500, t, a, b, { dir: 'ltr', track: .35, trackIn: .4, fill: '#FFAD40', blur: 8, rise: 10 });
    textIn(ar, lx, ly, V ? 120 : 132, 700, t, a + .05, b, { glow: 'rgba(255,72,115,.55)', blur: 18, scale: .08 });
    textIn(line, lx, sub, V ? 44 : 42, 300, t, a + .25, b, { alpha: .9, blur: 10, rise: 18 });
  }
}

// ============================================================== Act 4: the crowd, voices rising
const horizonY = t => (V ? -.34 : -.20) - ss(21, 25.3, t) * 1.7;
const CROWD = [];
{
  const n = V ? 46 : 64;
  for(let i = 0; i < n; i++){
    const z = Math.pow(i / (n - 1), 1.0);
    const spread = (V ? 1.15 : 2.0) * (1 + z * .5);
    let x = (rnd(i * 2.3) - .5) * spread;
    if(i === n - 1) x = V ? -.34 : -.62;
    if(i === n - 2) x = V ? .36 : .66;
    const phone = rnd(i * 5.1) > .3 || i >= n - 3;
    CROWD.push({ z, x, phone, both: rnd(i * 8.7) > .8, seed: i, ci: [0, 1, 2, 3, 4][i % 5] });
  }
}
function crowdGeo(P, t){
  const hy0 = V ? -.34 : -.20;
  const cam = ss(21, 25.3, t) * 1.7 * (0.55 + .45 * P.z);   // parallax
  const footY = hy0 - .015 - P.z * P.z * (V ? .7 : .5) - cam;
  const hgt = (.06 + P.z * P.z * (V ? .62 : .5));
  return { fx: X(P.x), fy: Y(footY), h: hgt * S0 };
}
const crowdCv = document.createElement('canvas'); crowdCv.width = W; crowdCv.height = H;
const cc = crowdCv.getContext('2d');
function drawCrowd(t){
  const a = ss(20.0, 20.5, t) * (1 - ss(24.6, 25.1, t));
  if(a <= 0) return [];
  cc.clearRect(0, 0, W, H);
  const phones = [];
  for(const P of CROWD){
    const g = crowdGeo(P, t);
    if(g.fy - g.h > H + 50) continue;
    const sway = Math.sin(t * 1.4 + P.seed) * .08;
    const lift = ss(20.3 + rnd(P.seed) * .8, 21.2 + rnd(P.seed) * .8, t);
    const up = P.phone ? lerp(.3, 2.75 + sway, lift) : .15 + sway * .3;
    const o = { r: [up, P.phone ? -.35 * lift : .1], l: P.both ? [up * .95, -.3] : [.2 + sway, .15], headTilt: -.15 * lift, lean: sway, hair: rnd(P.seed * 9.1) > .6 };
    const shade = Math.round(4 + 10 * (1 - P.z));
    cc.fillStyle = cc.strokeStyle = `rgb(${shade + 4},${shade},${shade + 8})`;
    const hands = person(cc, g.fx, g.fy, g.h, o);
    if(P.phone && lift > .2){
      const [hx, hy] = hands.r;
      const pw = g.h * .055, phh = g.h * .1;
      cc.save(); cc.translate(hx, hy - phh * .3); cc.rotate(sway * .5);
      cc.fillStyle = '#05040a'; cc.fillRect(-pw / 2, -phh / 2, pw, phh);
      const sg = cc.createLinearGradient(0, -phh / 2, 0, phh / 2);
      sg.addColorStop(0, BRAND[P.ci]); sg.addColorStop(1, '#ffffff');
      cc.globalAlpha = lift; cc.fillStyle = sg; cc.fillRect(-pw * .42, -phh * .44, pw * .84, phh * .88);
      cc.restore();
      phones.push({ x: hx, y: hy - phh * .3, s: g.h, ci: P.ci, seed: P.seed, lift });
    }
  }
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(255,130,100,.55)'; ctx.shadowBlur = 10 * S;
  ctx.drawImage(crowdCv, 0, 0);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const ph of phones) glowDot(ph.x, ph.y, ph.s * .14, ph.ci, a * ph.lift * .9);
  ctx.restore();
  return phones;
}

function drawRisingLights(t, phones){
  const a = ss(20.6, 21.2, t) * (1 - ss(24.4, 25.0, t));
  if(a <= 0) return;
  const cam = ss(21, 25.3, t) * 1.7;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const P of CROWD){
    if(!P.phone) continue;
    const g0 = crowdGeo(P, 20.8);
    const baseX = (g0.fx - W / 2) / S0, baseY = (H / 2 - (g0.fy - g0.h * 1.05)) / S0;
    const camAtBirth = 0;
    for(let k = 0; k < 16; k++){
      const tb = 20.7 + k * .26 + rnd(P.seed * 31 + k) * .26;
      const age = t - tb; if(age < 0 || age > 4.2) continue;
      const rise = age * (.28 + .1 * rnd(k + P.seed)) + age * age * .16;
      const conv = ss(0, 4, age) * .55;
      const wx = lerp(baseX, 0, conv) + Math.sin(age * 2.5 + k + P.seed) * .025;
      const wy = baseY + rise - cam * (.55 + .45 * P.z) + 0;
      const px = X(wx), py = Y(wy);
      if(py < -40 || py > H + 40) continue;
      const fadeIn = clamp01(age * 3), fadeOut = clamp01((4.2 - age) * 1.2);
      glowDot(px, py, (6 + 10 * P.z) * S * (1 + .3 * Math.sin(age * 9 + k)), (P.ci + k) % 6, a * fadeIn * fadeOut * .95);
    }
  }
  ctx.restore();
}

// ============================================================== Act 5: logo
const LOGO = V
  ? { iconY: Y(.36), iconS: .22 * S0, wordY: Y(.12), wordPx: .25 * S0, tagY: Y(-.06), tagPx: 66, ctaY: Y(-.2), platY: Y(-.29) }
  : { iconY: Y(.25), iconS: .16 * S0, wordY: Y(.045), wordPx: .19 * S0, tagY: Y(-.115), tagPx: 54, ctaY: Y(-.225), platY: Y(-.3) };

function drawIcon(c, x, y, s, glow){
  c.save(); c.translate(x, y);
  if(glow){ c.shadowColor = 'rgba(255,72,115,.8)'; c.shadowBlur = glow * S; }
  c.fillStyle = brandGrad(c, -s / 2, -s / 2, s / 2, s / 2);
  c.beginPath(); c.roundRect(-s / 2, -s / 2, s, s, s * .25); c.fill();
  c.shadowBlur = 0;
  const hl = c.createLinearGradient(0, -s / 2, 0, s / 2);
  hl.addColorStop(0, 'rgba(255,255,255,.28)'); hl.addColorStop(.5, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.fill();
  // "u" whose right stroke rises into an arrow
  c.strokeStyle = '#fff'; c.lineWidth = s * .115; c.lineCap = 'round'; c.lineJoin = 'round';
  const r = s * .19, by = s * .06;
  c.beginPath(); c.moveTo(-r, -s * .17); c.lineTo(-r, by); c.arc(0, by, r, Math.PI, 0, true); c.lineTo(r, -s * .27); c.stroke();
  c.beginPath(); c.moveTo(r - s * .11, -s * .17); c.lineTo(r, -s * .28); c.lineTo(r + s * .11, -s * .17); c.stroke();
  c.restore();
}

// target points for particles forming the wordmark
const wordPts = [];
{
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d');
  window.buildWordPts = () => {
    o.clearRect(0, 0, W, H);
    o.font = `${LOGO.wordPx}px RX700`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
    o.fillText('ulu', W / 2, LOGO.wordY);
    drawIcon(o, W / 2, LOGO.iconY, LOGO.iconS, 0);
    const d = o.getImageData(0, 0, W, H).data; const step = Math.round(7 * S);
    for(let y = 0; y < H; y += step) for(let x = 0; x < W; x += step) if(d[(y * W + x) * 4 + 3] > 128) wordPts.push([x, y]);
  };
}

function drawLogo(t){
  if(t < 23.9) return;
  // particles stream up and lock into the mark
  const pa = 1 - ss(25.05, 25.6, t);
  if(pa > 0){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    wordPts.forEach((pt, i) => {
      const d = rnd(i * 1.7) * .55;
      const k = easeInOut((t - 23.95 - d) / (1.05 - d * .3));
      if(k <= 0) return;
      const sx = W * rnd(i * 3.3), sy = H + 60 * S + H * .25 * rnd(i * 4.4);
      const cx = lerp(sx, pt[0], .5) + (rnd(i * 5.5) - .5) * 500 * S, cy = lerp(sy, pt[1], .5) + 200 * S;
      const u = 1 - k;
      const x = u * u * sx + 2 * u * k * cx + k * k * pt[0];
      const y = u * u * sy + 2 * u * k * cy + k * k * pt[1];
      glowDot(x, y, 7 * S, i % 6, pa * (.5 + .5 * k));
    });
    ctx.restore();
  }
  const la = ss(24.85, 25.2, t);
  if(la <= 0) return;
  const pop = backOut((t - 24.95) / .6);
  ctx.save();
  ctx.globalAlpha = la;
  ctx.translate(W / 2, LOGO.iconY); ctx.scale(pop, pop); ctx.translate(-W / 2, -LOGO.iconY);
  drawIcon(ctx, W / 2, LOGO.iconY, LOGO.iconS, 60 + 60 * Math.exp(-(t - 25) * 2));
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = la;
  ctx.font = `${LOGO.wordPx}px RX700`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,72,115,.6)'; ctx.shadowBlur = (30 + 50 * Math.exp(-(t - 25) * 2)) * S;
  const m = ctx.measureText('ulu').width;
  ctx.fillStyle = brandGrad(ctx, W / 2 - m / 2, 0, W / 2 + m / 2, 0);
  ctx.fillText('ulu', W / 2, LOGO.wordY);
  // shimmer
  const k = (t - 25.6) / 1.0;
  if(k > 0 && k < 1){
    const sx = W / 2 - m / 2 - 150 * S + (m + 300 * S) * k;
    const g = ctx.createLinearGradient(sx - 90 * S, 0, sx + 90 * S, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0; ctx.fillStyle = g; ctx.fillText('ulu', W / 2, LOGO.wordY);
  }
  ctx.restore();
  textIn('خلّ صوتك يعلو', W / 2, LOGO.tagY, LOGO.tagPx, 500, t, 25.9, 99, { glow: 'rgba(255,150,120,.45)', blur: 14 });
  // CTA
  const ca = ss(27.0, 27.6, t);
  if(ca > 0){
    const pulse = 1 + .03 * Math.exp(-(((t - 27) % BEAT) / BEAT) * 5) * (t > 27.6 ? 1 : 0);
    const cw = (V ? 470 : 400) * S, chh = (V ? 96 : 80) * S;
    ctx.save(); ctx.globalAlpha = ca;
    ctx.translate(W / 2, LOGO.ctaY + (1 - easeOut((t - 27) / .6)) * 20 * S); ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(255,72,115,.6)'; ctx.shadowBlur = 40 * S;
    ctx.fillStyle = brandGrad(ctx, -cw / 2, 0, cw / 2, 0);
    ctx.beginPath(); ctx.roundRect(-cw / 2, -chh / 2, cw, chh, chh / 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = font(700, (V ? 40 : 34) * S);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
    ctx.fillText('حمّل التطبيق الآن', 0, 2 * S);
    ctx.restore();
  }
  textIn('iOS  ·  Android', W / 2, LOGO.platY, V ? 30 : 26, 300, t, 27.4, 99, { dir: 'ltr', track: .2, alpha: .7, blur: 6, rise: 8 });
}

// ============================================================== frame
function render(t){
  gl.uniform2f(uRes, W, H); gl.uniform1f(uT, t); gl.uniform1f(uV, V);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(glc, 0, 0);

  // Act 1–2 copy
  textIn('كل شي يبدأ بلحظة', X(0), Y(V ? -.12 : -.14), V ? 64 : 58, 300, t, 1.3, 3.6, { blur: 16, glow: 'rgba(255,170,150,.4)' });
  drawGlobeLayer(t);
  const t2x = V ? X(0) : X(-.46), t2y = V ? Y(.55) : Y(.04);
  textIn('…وتوصل للعالم كله', t2x, t2y, V ? 78 : 70, 500, t, 5.6, 9.3, { blur: 16, glow: 'rgba(120,140,255,.45)' });
  // Act 3
  drawPhone(t);
  drawAppText(t);
  // Act 4
  const phones = drawCrowd(t);
  drawRisingLights(t, phones);
  textIn('ملايين الأصوات…', X(0), Y(V ? .52 : .3), V ? 70 : 62, 300, t, 21.2, 23.9, { blur: 16, glow: 'rgba(255,160,130,.45)' });
  textIn('مكان واحد', X(0), Y(V ? .41 : .19), V ? 104 : 92, 700, t, 21.9, 23.9, { blur: 18, glow: 'rgba(255,72,115,.55)', sweep: 22.6 });
  // Act 5
  drawLogo(t);
}

window.renderFrame = function(i, q){
  render(i / FPS);
  return out.toDataURL('image/jpeg', q || .95);
};
window.ready = Promise.all(['RX300', 'RX500', 'RX700'].flatMap(f => [document.fonts.load(`40px ${f}`, 'ulu'), document.fonts.load(`40px ${f}`, 'سلام')]))
  .then(() => document.fonts.load(`40px ${EMOJI}`, '🔥')).then(() => buildWordPts());
