<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ================================================================ setup
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const SS = +(Q.get('ss') || 1);               // supersampling factor for the 3D pass
const V = H > W;                             // vertical deliverable
const S = Math.min(W, H) / 1080;
const FPS = 30;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W * SS, H * SS, false);
renderer.domElement.id = 'gl'; document.body.appendChild(renderer.domElement);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const out = document.getElementById('out'); out.width = W; out.height = H;
const ctx = out.getContext('2d');

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ================================================================ helpers
const clamp01 = x => Math.max(0, Math.min(1, x));
const ss = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = x => Math.pow(clamp01(x), 3);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = x => { x = clamp01(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const vlerp = (a, b, k) => a.clone().lerp(b, k);
function rnd(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const BEAT = 60 / 100;

const mats = {};
function std(color, o = {}){
  const key = color + JSON.stringify(o);
  if(!mats[key]) mats[key] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .55, metalness: 0 }, o));
  return mats[key];
}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if(parent) parent.add(m);
  return m;
}
const G = {
  sph: (r, w = 32, h = 24) => new THREE.SphereGeometry(r, w, h),
  cap: (r, l, rs = 20) => new THREE.CapsuleGeometry(r, l, 8, rs),
  box: (x, y, z) => new THREE.BoxGeometry(x, y, z),
  cyl: (rt, rb, h, s = 32) => new THREE.CylinderGeometry(rt, rb, h, s),
  cone: (r, h, s = 32) => new THREE.ConeGeometry(r, h, s),
  tor: (r, t, rs = 16, ts = 48, arc = Math.PI * 2) => new THREE.TorusGeometry(r, t, rs, ts, arc),
};

// glow sprite texture
function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.2, 'rgba(255,255,255,.8)'); gr.addColorStop(.5, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTexture();
const XMAS = [0xff3344, 0xffc94d, 0x33ee88, 0x66bbff, 0xfff1cc];

// ================================================================ characters
function face(parent, r, y, z, o = {}){
  const g = new THREE.Group(); g.position.set(0, y, z); parent.add(g);
  const black = std('#140f0e', { roughness: .25 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const eyes = [];
  for(const s of [-1, 1]){
    const e = mesh(G.sph(r * .17, 20, 16), black, s * r * .36, r * .1, r * .86, g); e.scale.set(1, 1.18, .7);
    mesh(G.sph(r * .055, 10, 8), white, s * r * .36 + r * .05, r * .18, r * .98, g);
    const ch = mesh(G.sph(r * .14, 16, 12), std('#ff8f8f', { roughness: .9, transparent: true, opacity: .55 }), s * r * .58, -r * .14, r * .76, g); ch.scale.set(1, .6, .4);
    eyes.push(e);
  }
  const smile = mesh(G.tor(r * .2, r * .035, 8, 24, Math.PI), std('#4a2320', { roughness: .6 }), 0, -r * .22, r * .93, g);
  smile.rotation.z = Math.PI;
  mesh(G.sph(r * .08, 12, 10), std(o.skin || '#f2c6a0', { roughness: .6 }), 0, -r * .04, r * 1.0, g);
  return { g, eyes, smile };
}

function limbs(root, o, scale = 1){
  // arms + legs with pivots for animation
  const parts = {};
  const suit = o.suitMat, glove = o.gloveMat, boot = o.bootMat;
  for(const s of [-1, 1]){
    const sh = new THREE.Group(); sh.position.set(s * .37 * scale, .66 * scale, 0); root.add(sh);
    mesh(G.cap(.105 * scale, .2 * scale), suit, 0, -.17 * scale, 0, sh);
    const el = new THREE.Group(); el.position.set(0, -.34 * scale, 0); sh.add(el);
    mesh(G.cap(.095 * scale, .18 * scale), suit, 0, -.15 * scale, 0, el);
    if(o.cuffMat) { const c = mesh(G.tor(.1 * scale, .025 * scale, 8, 24), o.cuffMat, 0, -.26 * scale, 0, el); c.rotation.x = Math.PI / 2; }
    const hand = mesh(G.sph(.115 * scale, 20, 16), glove, 0, -.33 * scale, 0, el);
    const hip = new THREE.Group(); hip.position.set(s * .15 * scale, .1 * scale, 0); root.add(hip);
    mesh(G.cap(.125 * scale, .2 * scale), o.legMat || suit, 0, -.16 * scale, 0, hip);
    const kn = new THREE.Group(); kn.position.set(0, -.33 * scale, 0); hip.add(kn);
    mesh(G.cap(.115 * scale, .16 * scale), o.legMat || suit, 0, -.12 * scale, 0, kn);
    const b = mesh(G.box(.2 * scale, .13 * scale, .3 * scale), boot, 0, -.3 * scale, .04 * scale, kn);
    parts[s < 0 ? 'L' : 'R'] = { sh, el, hand, hip, kn };
  }
  return parts;
}

function santaHat(parent, y, r, tilt = .25){
  const g = new THREE.Group(); g.position.set(0, y, 0); g.rotation.z = -tilt; parent.add(g);
  const red = std('#d1132a', { roughness: .8 }), wh = std('#fbf7f0', { roughness: 1 });
  const cone = mesh(G.cone(r, r * 2.1, 32), red, 0, r * 1.0, 0, g); cone.rotation.z = -.12;
  const brim = mesh(G.tor(r * .98, r * .26, 14, 40), wh, 0, 0, 0, g); brim.rotation.x = Math.PI / 2;
  mesh(G.sph(r * .32, 16, 12), wh, r * .28, r * 2.05, 0, g);
  return g;
}

function makeAstronaut(o){
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const suit = std('#dcdad4', { roughness: .7 });
  const accent = std(o.accent, { roughness: .5 });
  const metal = std('#9aa3ad', { roughness: .3, metalness: .8 });
  const t = mesh(G.cap(.32, .36, 28), suit, 0, .45, 0, body); t.scale.set(1, 1, .86);
  const belt = mesh(G.tor(.31, .04, 10, 40), accent, 0, .26, 0, body); belt.rotation.x = Math.PI / 2;
  mesh(G.box(.3, .2, .08), std('#d9dde2', { roughness: .4 }), 0, .56, .27, body);
  [['#ff4455', -.08], ['#44ccff', 0], ['#ffd34d', .08]].forEach(([c, x]) =>
    mesh(G.sph(.03, 10, 8), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 1.6 }), x, .58, .32, body));
  mesh(G.box(.52, .58, .26), suit, 0, .52, -.36, body);
  mesh(G.cyl(.06, .06, .5, 16), metal, -.17, .52, -.5, body).rotation.x = 0;
  mesh(G.cyl(.06, .06, .5, 16), metal, .17, .52, -.5, body);
  const ring = mesh(G.tor(.27, .055, 12, 40), metal, 0, .86, 0, body); ring.rotation.x = Math.PI / 2;
  // head
  const head = new THREE.Group(); head.position.set(0, 1.12, 0); body.add(head);
  mesh(G.sph(.26, 40, 30), std(o.skin, { roughness: .6 }), 0, 0, 0, head);
  const hair = mesh(new THREE.SphereGeometry(.272, 32, 16, 0, Math.PI * 2, 0, Math.PI * .45), std(o.hair, { roughness: .7 }), 0, .01, -.015, head);
  hair.rotation.x = -.25;
  if(o.ponytail){ const p = mesh(G.sph(.12, 16, 12), std(o.hair, { roughness: .7 }), 0, -.02, -.29, head); p.scale.set(.9, 1.3, .9); }
  const f = face(head, .26, -.02, 0, { skin: o.skin });
  // helmet: white shell at the back, clear visor at the front
  mesh(new THREE.SphereGeometry(.44, 40, 30, Math.PI, Math.PI, 0, Math.PI), suit, 0, 0, 0, head);
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xcfe9ff, roughness: .04, metalness: 0, transparent: true, opacity: .1, envMap: envTex, envMapIntensity: .5, clearcoat: .6, depthWrite: false });
  const visor = new THREE.Mesh(new THREE.SphereGeometry(.445, 40, 30, 0, Math.PI, 0, Math.PI), glass); head.add(visor);
  const rim = mesh(G.tor(.44, .03, 10, 48), accent, 0, 0, 0, head);
  if(o.hat) santaHat(head, .4, .22);
  const P = limbs(body, { suitMat: suit, gloveMat: std(o.glove || '#c9ced6', { roughness: .5 }), bootMat: std('#c9ced6', { roughness: .5 }), cuffMat: accent });
  return { root, body, head, face: f, P };
}

function makePerson(o){
  const root = new THREE.Group();
  const sc = o.scale || 1;
  const body = new THREE.Group(); body.scale.setScalar(sc); root.add(body);
  const sw = std(o.sweater, { roughness: .9 });
  const t = mesh(G.cap(.3, .32, 28), sw, 0, .45, 0, body); t.scale.set(1, 1, .82);
  const band = mesh(G.tor(.29, .035, 8, 40), std(o.band || '#fbf7f0', { roughness: .9 }), 0, .52, 0, body); band.rotation.x = Math.PI / 2;
  const scarf = mesh(G.tor(.2, .07, 12, 36), std(o.scarf || '#d1132a', { roughness: .95 }), 0, .8, 0, body); scarf.rotation.x = Math.PI / 2;
  const head = new THREE.Group(); head.position.set(0, 1.08, 0); body.add(head);
  mesh(G.sph(.27, 40, 30), std(o.skin, { roughness: .6 }), 0, 0, 0, head);
  const hm = std(o.hair, { roughness: .75 });
  const cap = mesh(new THREE.SphereGeometry(.285, 32, 16, 0, Math.PI * 2, 0, Math.PI * .5), hm, 0, .02, -.02, head); cap.rotation.x = -.3;
  if(o.style === 'long'){ const b = mesh(G.sph(.27, 24, 18), hm, 0, -.12, -.1, head); b.scale.set(1.02, 1.2, .8); }
  if(o.style === 'bun'){ mesh(G.sph(.12, 16, 12), hm, 0, .26, -.12, head); }
  if(o.style === 'curly'){ for(let i = 0; i < 9; i++){ const a = i / 9 * Math.PI * 2; mesh(G.sph(.1, 12, 10), hm, Math.cos(a) * .22, .14 + Math.sin(i) * .03, Math.sin(a) * .22 - .03, head); } }
  const f = face(head, .27, -.02, 0, { skin: o.skin });
  if(o.hat === 'santa') santaHat(head, .2, .2);
  if(o.hat === 'beanie'){
    const bm = std(o.beanie || '#2c6e49', { roughness: .95 });
    mesh(new THREE.SphereGeometry(.3, 32, 16, 0, Math.PI * 2, 0, Math.PI * .5), bm, 0, .05, 0, head);
    const r = mesh(G.tor(.28, .05, 10, 36), std('#fbf7f0', { roughness: 1 }), 0, .07, 0, head); r.rotation.x = Math.PI / 2;
    mesh(G.sph(.08, 14, 10), std('#fbf7f0', { roughness: 1 }), 0, .36, 0, head);
  }
  const P = limbs(body, { suitMat: sw, gloveMat: std(o.mitten || '#d1132a', { roughness: .95 }), bootMat: std('#3a2a22', { roughness: .7 }), legMat: std(o.pants || '#2b3245', { roughness: .85 }) });
  return { root, body, head, face: f, P };
}

// pose helpers: angles in radians
function pose(c, p){
  const { L, R } = c.P;
  L.sh.rotation.set(p.lx || 0, 0, -(p.lz || .15)); R.sh.rotation.set(p.rx || 0, 0, (p.rz || .15));
  L.el.rotation.set(p.lex || -.15, 0, 0); R.el.rotation.set(p.rex || -.15, 0, 0);
  L.hip.rotation.set(p.llx || 0, 0, -(p.llz || .03)); R.hip.rotation.set(p.rlx || 0, 0, (p.rlz || .03));
  L.kn.rotation.set(p.lkx || 0, 0, 0); R.kn.rotation.set(p.rkx || 0, 0, 0);
  c.head.rotation.set(p.hx || 0, p.hy || 0, p.hz || 0);
  c.body.rotation.set(p.bx || 0, p.by || 0, p.bz || 0);
  const sm = p.smile ?? 1; c.face.smile.scale.set(sm, sm, 1);
  const blink = p.blink ? .12 : 1; c.face.eyes.forEach(e => e.scale.y = 1.18 * blink);
}
const blinkAt = (t, seed) => ((t + seed * 1.7) % 3.1) < .12;

// ================================================================ SPACE scene
const space = new THREE.Scene();
space.environment = envTex; space.environmentIntensity = .22;
space.background = new THREE.Color(0x000000);

const SUN = v3(.55, .28, -1).normalize();
const sun = new THREE.DirectionalLight(0xfff1dd, 2.0); sun.position.copy(SUN).multiplyScalar(50); space.add(sun);
const fill = new THREE.DirectionalLight(0xbfd4ff, .75); fill.position.set(-6, 3, 12); space.add(fill);
const earthshine = new THREE.DirectionalLight(0x4f7dff, .5); earthshine.position.set(0, -10, 2); space.add(earthshine);
space.add(new THREE.AmbientLight(0x223355, .25));

// stars
{
  const n = 4000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for(let i = 0; i < n; i++){
    const u = rnd(i * 1.3) * 2 - 1, a = rnd(i * 2.7) * Math.PI * 2, r = 600;
    const s = Math.sqrt(1 - u * u);
    pos.set([Math.cos(a) * s * r, u * r, Math.sin(a) * s * r], i * 3);
    const w = .6 + .4 * rnd(i * 5.1), tint = rnd(i * 9.3);
    col.set([w * (tint > .7 ? 1 : .8), w * .88, w * (tint < .3 ? 1 : .85)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  space.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2 * S, sizeAttenuation: false, vertexColors: true, map: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
}

// Earth
const NOISE = `
float h31(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm3(vec3 p){ float v = 0., a = .5; for(int i=0;i<5;i++){ v += a*noise3(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return v; }
`;
const earthMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN }, uT: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vO; varying vec3 vW;
    void main(){ vO = normalize(position); vN = normalize(mat3(modelMatrix)*normal); vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: NOISE + `uniform vec3 uSun; uniform float uT; varying vec3 vN; varying vec3 vO; varying vec3 vW;
    void main(){
      vec3 n = normalize(vO), N = normalize(vN), Vd = normalize(cameraPosition - vW);
      float cont = fbm3(n*2.3 + vec3(3.1,1.2,7.7));
      float land = smoothstep(.49, .53, cont);
      float shallow = smoothstep(.43, .5, cont)*(1. - land);
      vec3 ocean = mix(vec3(.01,.05,.16), vec3(.03,.2,.35), shallow);
      float dry = fbm3(n*6. + 4.);
      vec3 ground = mix(vec3(.10,.24,.08), vec3(.34,.27,.14), smoothstep(.4,.65,dry));
      float snow = smoothstep(.62, .8, abs(n.y) + .15*fbm3(n*8.));
      ground = mix(ground, vec3(.92,.95,1.), snow);
      vec3 surf = mix(ocean, ground, land);
      float cl = smoothstep(.5, .75, fbm3(n*4.2 + vec3(uT*.004, 0., 0.)));
      float NdL = dot(N, uSun);
      float day = smoothstep(-.08, .3, NdL);
      vec3 H = normalize(uSun + Vd);
      float spec = pow(max(dot(N, H), 0.), 60.)*(1. - land)*(1. - cl)*1.2;
      vec3 dayC = mix(surf, vec3(1.), cl*.92)*max(NdL, 0.)*1.6 + vec3(1.,.9,.75)*spec*day;
      float region = smoothstep(.4, .72, fbm3(n*7. + 11.));
      float pts = pow(noise3(n*180.), 6.)*4. + pow(noise3(n*460.+3.), 8.)*5.;
      vec3 city = mix(vec3(1.,.62,.3), vec3(1.,.25,.3), step(.85, noise3(n*90.)));
      city = mix(city, vec3(.35,1.,.55), step(.93, noise3(n*70.+5.)));
      vec3 nightC = city*land*region*pts*(1. - cl*.7)*.9 + vec3(.005,.01,.03)*(1. + land);
      vec3 col = dayC*day + nightC*(1. - day);
      col += vec3(1.,.45,.2)*exp(-abs(NdL)*9.)*.35;
      float fr = pow(1. - max(dot(N, Vd), 0.), 3.);
      col += vec3(.3,.55,1.)*fr*(smoothstep(-.3,.4,NdL)*1.2 + .1);
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN } }, transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix)*normal); vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vW;
    void main(){ vec3 Vd = normalize(cameraPosition - vW); float rim = pow(clamp(1. + dot(vN, Vd)*1.0, 0., 1.), 5.);
      float lit = smoothstep(-.5, .5, dot(-vN, -uSun)*-1.);
      vec3 c = mix(vec3(.25,.5,1.), vec3(1.,.6,.35), smoothstep(.1,.5,lit)*.0) ;
      float sunSide = smoothstep(-.6, .6, dot(normalize(vW), uSun));
      gl_FragColor = vec4(c*rim*(.35 + 1.6*sunSide) + vec3(1.,.55,.3)*rim*pow(sunSide,6.)*1.5, 1.); }`
});
const EARTH_R = 60;
const earth = new THREE.Group(); earth.position.set(0, -76, -30); space.add(earth);
const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 160, 120), earthMat); earth.add(earthMesh);
earth.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.03, 120, 90), atmoMat));
// sun glare sprite
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffe6c0, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
sunSprite.position.copy(SUN).multiplyScalar(500); sunSprite.scale.setScalar(70); space.add(sunSprite);

// ---------------------------------------------------------------- station
const station = new THREE.Group(); space.add(station);
{
  const white = std('#e9e7e2', { roughness: .5 }), gray = std('#8a929c', { roughness: .35, metalness: .7 }), gold = std('#c9a24a', { roughness: .35, metalness: .9 });
  const main = mesh(G.cyl(1.2, 1.2, 7, 48), white, 0, 0, 0, station); main.rotation.z = Math.PI / 2;
  for(let i = -3; i <= 3; i++){ const r = mesh(G.tor(1.22, .05, 8, 48), gray, i * 1.05, 0, 0, station); r.rotation.y = Math.PI / 2; }
  for(const s of [-1, 1]){
    const cap = mesh(new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), white, s * 3.5, 0, 0, station); cap.rotation.z = -s * Math.PI / 2;
    const node = mesh(G.cyl(.85, .85, 2.4, 32), gold, s * 5.4, 0, 0, station); node.rotation.z = Math.PI / 2;
  }
  const side = mesh(G.cyl(.8, .8, 3.2, 32), white, -1.2, 0, -2.2, station); side.rotation.x = Math.PI / 2;
  // truss + solar arrays
  const truss = mesh(G.box(.25, .25, 16), gray, 1.6, 0, -1.0, station);

function portrait(p, size){
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const r = size / 2;
  const ring = g.createLinearGradient(0, 0, size, size); ring.addColorStop(0, '#ffcf6b'); ring.addColorStop(1, '#ff3d7f');
  g.fillStyle = ring; g.beginPath(); g.arc(r, r, r, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(r, r, r * .86, 0, 7); g.clip();
  const bg = g.createLinearGradient(0, 0, 0, size); bg.addColorStop(0, p.bg[0]); bg.addColorStop(1, p.bg[1]); g.fillStyle = bg; g.fillRect(0, 0, size, size);
  g.fillStyle = '#d1132a'; g.beginPath(); g.ellipse(r, size * 1.02, r * .75, r * .55, 0, 0, 7); g.fill();
  g.fillStyle = p.skin; g.beginPath(); g.arc(r, r * 1.02, r * .42, 0, 7); g.fill();
  g.fillStyle = p.hair; g.beginPath(); g.arc(r, r * .92, r * .44, Math.PI * 1.02, Math.PI * 1.98); g.fill();
  g.fillStyle = '#1a1210'; for(const s of [-1, 1]){ g.beginPath(); g.ellipse(r + s * r * .15, r * 1.04, r * .05, r * .065, 0, 0, 7); g.fill(); }

  g.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ================================================================ animation
function crewPose(t){
  // idle float for everyone
  const fl = (c, home, seed) => {
    c.root.position.copy(home).add(v3(Math.sin(t * .6 + seed) * .06, Math.sin(t * .8 + seed * 2) * .1, Math.cos(t * .5 + seed) * .05));
    c.root.rotation.set(Math.sin(t * .4 + seed) * .05, 0, Math.sin(t * .5 + seed) * .06);
  };
  fl(max, CREW_HOME.max, 0); fl(luna, CREW_HOME.luna, 2); fl(kai, CREW_HOME.kai, 4);
  max.root.rotation.y = -.15; luna.root.rotation.y = .35; kai.root.rotation.y = -.45;

  // ---- Max: looks at Earth, sighs; then the phone moment; then stories
  const look = ss(1.5, 3.2, t) * (1 - ss(5.6, 6.4, t));
  const sigh = Math.sin(clamp01((t - 3.6) / 1.6) * Math.PI) * (t < 5.2 ? 1 : 0);
  const raise = ss(6.2, 7.0, t) * (1 - ss(17.6, 18.2, t));
  const tap = Math.exp(-Math.pow((t - 7.35) * 9, 2)) + Math.exp(-Math.pow((t - 8.95) * 9, 2));
  const joy = ss(9.0, 9.4, t);
  const wave = ss(18.1, 18.5, t) * (1 - ss(24.2, 24.6, t));
  const wv = Math.sin(t * 9) * .35;
  pose(max, {
    hx: look * .45 + sigh * .1 - raise * .25 * (1 - joy) + joy * -.05, hy: look * -.15,
    lz: .2 + raise * .25, lx: -raise * 1.25, lex: -.2 - raise * 1.1,
    rz: .2 + raise * .1 + wave * 2.3, rx: -raise * .9 - tap * .25, rex: -.25 - raise * 1.2 + wave * .4 + wave * wv,
    bx: sigh * .12, llx: .2, rlx: -.15, lkx: .3, rkx: .25,
    smile: lerp(1, .55, look) * (1 - joy) + joy * 1.5, blink: blinkAt(t, 1),
  });
  if(t > 15.6 && t < 18.2){ max.root.rotation.y = -.15 + Math.sin((t - 15.6) * 1.2) * .2; }

  // ---- Luna goes live (wave at the audience)
  const lw = ss(11.0, 11.4, t) * (1 - ss(13.4, 13.8, t)) + wave;
  pose(luna, {
    rz: .2 + lw * 2.4, rex: -.3 + Math.sin(t * 8) * .4 * lw, lz: .25, lex: -.5, lx: -.3 * ss(11, 11.4, t),
    hz: Math.sin(t * 3) * .06 * lw, hx: -.05, llx: -.15, rlx: .2, lkx: .25, rkx: .35, smile: 1.35, blink: blinkAt(t, 2),
  });
  // ---- Kai dances in zero-g for a reel
  const dance = ss(13.4, 13.7, t) * (1 - ss(15.8, 16.1, t));
  const bt = t / BEAT * Math.PI;
  pose(kai, {
    rz: .3 + dance * (1.6 + .8 * Math.sin(bt)) + wave * 2.3, lz: .3 + dance * (1.6 - .8 * Math.sin(bt)) + wave * 1.8,
    rex: -.4 - dance * .8 * Math.abs(Math.sin(bt)) + wave * wv, lex: -.4 - dance * .8 * Math.abs(Math.cos(bt)),
    llx: dance * .7 * Math.sin(bt), rlx: -dance * .7 * Math.sin(bt), lkx: .3 + dance * .6, rkx: .3 + dance * .6,
    hz: dance * .2 * Math.sin(bt), smile: 1.3 + dance * .3, blink: blinkAt(t, 3),
  });
  if(dance > 0){ kai.root.rotation.y = -.45 + dance * (t - 13.4) * 2.6; kai.root.rotation.z = dance * Math.sin(bt * .5) * .25; }
}

function familyPose(t){
  const wave = ss(20.6, 21.0, t);
  FAMILY.forEach((p, i) => {
    const ph = t * 8 + i;
    const w = wave * (i === 3 ? 0 : 1);
    const jump = (i === 2) ? Math.max(0, Math.sin(t * 6.5)) * .18 * wave : 0;
    p.root.position.y = jump;
    pose(p, {
      rz: .15 + w * (2.3 + .15 * Math.sin(i)), rex: -.2 + Math.sin(ph) * .45 * w,
      lz: .15 + (i === 5 ? w * 2.2 : 0), lex: i === 5 ? -.2 + Math.cos(ph) * .4 * w : -.25,
      hx: -.18 - (i >= 2 && i <= 3 ? .12 : 0), hy: -.12, hz: Math.sin(t * 2 + i) * .05,
      smile: 1.4, blink: blinkAt(t, i + 5),
    });
    if(i === 3) pose(p, { rx: -1.2, rex: -1.2, rz: .2, lz: .15, hx: -.1, smile: 1.5, blink: blinkAt(t, 9) });
  });
}

// ---- shot list ----
function shot(t){
  // returns { scene, camPos, camLook, fov }
  const M = CREW_HOME.max;
  if(t < 6.0){                                   // S1: wide -> Max at the window
    const k = easeInOut(t / 6.0);
    return { scene: space, pos: vlerp(v3(13, 4.5, 21), v3(3.9, 1.35, 7.6), k), look: vlerp(v3(0, -1, 0), M.clone().add(v3(0, .9, 0)), k), fov: lerp(40, 32, k) };
  }
  if(t < 11.0){                                  // S2: close on Max + phone
    const k = easeInOut((t - 6.0) / 5.0);
    return { scene: space, pos: M.clone().add(v3(lerp(1.3, .9, k), lerp(1.35, 1.2, k), lerp(3.7, 3.1, k))), look: M.clone().add(v3(lerp(-.05, -.2, k), lerp(1.0, 1.05, k), .2)), fov: 32 };
  }
  if(t < 13.4){                                  // S3a: Luna live
    const k = easeInOut((t - 11.0) / 2.4); const L = CREW_HOME.luna;
    return { scene: space, pos: L.clone().add(v3(lerp(1.4, .6, k), lerp(1.3, 1.0, k), lerp(3.6, 3.0, k))), look: L.clone().add(v3(-.35, .95, 0)), fov: 32 };
  }
  if(t < 15.8){                                  // S3b: Kai dance
    const k = easeInOut((t - 13.4) / 2.4); const K = CREW_HOME.kai;
    const a = lerp(-.5, .35, k);
    return { scene: space, pos: K.clone().add(v3(Math.sin(a) * 4.2, lerp(1.4, .9, k), Math.cos(a) * 4.2)), look: K.clone().add(v3(0, .75, 0)), fov: 34 };
  }
  if(t < 18.0){                                  // S3c: Max + story bubbles
    const k = easeInOut((t - 15.8) / 2.2);
    return { scene: space, pos: M.clone().add(v3(lerp(-1.2, -.4, k), lerp(1.6, 1.2, k), lerp(3.9, 3.2, k))), look: M.clone().add(v3(0, .85, 0)), fov: 36 };
  }
  if(t < 19.9){                                  // S4a: crew waves, then dive to Earth along the beam
    const k = easeIn((t - 18.4) / 1.5);
    const p0 = v3(1.0, 2.0, 8.5), target = earth.position.clone().add(v3(0, EARTH_R, 0).applyAxisAngle(v3(1, 0, 0), .55));
    const pos = vlerp(p0, target.clone().add(v3(0, 4, 6)), k);
    const look = vlerp(v3(1.0, .6, 2.6), target, ss(0, .6, k));
    return { scene: space, pos, look, fov: lerp(36, 55, k) };
  }
  if(t < 24.6){                                  // S4b: village
    const k = easeOut((t - 19.9) / 2.3), k2 = easeInOut((t - 22.2) / 2.4);
    const up = easeIn((t - 23.9) / .7);
    const pos = vlerp(v3(2, 26, 30), v3(.6, 2.1, 7.6), k).add(v3(0, -k2 * .2 + up * 10, -k2 * .9));
    const look = vlerp(v3(0, 0, -4), v3(-.1, 1.85, -.6), k).add(v3(0, up * 25, -up * 5));
    return { scene: village, pos, look, fov: 38 };
  }
  // S5: logo in space
  const k = easeOut((t - 24.6) / 5.4);
  return { scene: space, pos: v3(34 + lerp(2, 0, k), lerp(-3.6, -4.0, k), lerp(42, 36, k)), look: v3(34, -4.9, 20), fov: 34 };
}

// ================================================================ text overlay
function textIn(str, x, y, px, fontName, t, tin, tout, o = {}){
  const inD = o.inD || .6, outD = o.outD || .45;
  const a = ss(tin, tin + inD, t) * (1 - ss(tout, tout + outD, t));
  if(a <= .002) return;
  const pin = easeOut((t - tin) / inD), pout = ss(tout, tout + outD, t);
  ctx.save();
  ctx.globalAlpha = a * (o.alpha ?? 1);
  const blur = ((1 - pin) * (o.blur ?? 12) + pout * 8) * S;
  ctx.filter = blur > .3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  ctx.font = `${px * S}px ${fontName}, 'Noto Color Emoji'`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = `${((o.track || 0) + (1 - pin) * (o.trackIn ?? .08)) * px * S}px`;
  ctx.translate(x, y + (1 - pin) * (o.rise ?? 20) * S - pout * 12 * S);
  if(o.glow){ ctx.shadowColor = o.glow; ctx.shadowBlur = 26 * S; }
  ctx.fillStyle = o.fill || '#fff';
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

    ctx.shadowColor = 'rgba(255,220,170,.6)'; ctx.shadowBlur = 36 * S; ctx.fillStyle = '#f7f5f2';
    ctx.beginPath(); ctx.roundRect(-cw / 2, -ch / 2, cw, ch, ch / 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#1d1916'; ctx.font = `${(V ? 38 : 32) * S}px IDBold`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Download now', 0, 2 * S); ctx.restore();
  }
  textIn('✦  Happy Holidays  ✦', cx, V ? H * .1 : H * .09, V ? 36 : 30, 'IDMed', t, 27.5, 99, { fill: '#ffcf6b', track: .12 });
  // transitions: flash to white into and out of the village
  const flash = ss(19.55, 19.9, t) * (1 - ss(19.9, 20.4, t)) + ss(24.25, 24.6, t) * (1 - ss(24.6, 25.1, t));
  if(flash > 0){ ctx.save(); ctx.globalAlpha = flash; ctx.fillStyle = '#f4f8ff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  const fadeIn = 1 - ss(0, .9, t);
  if(fadeIn > 0){ ctx.save(); ctx.globalAlpha = fadeIn; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// ================================================================ frame
function render(t){
  earthMat.uniforms.uT.value = t;
  earthMesh.rotation.y = .4 + t * .006;
  station.position.set(0, 0, 0); station.rotation.set(.04 * Math.sin(t * .2), -.25, .02);
  twinkle(stationLights, 160, t);
  COTTAGES.forEach((c, j) => twinkle(c.userData.lights, 14, t + j, 3));
  twinkle(treeLights, 220, t, 3.4);
  tree.userData.star.rotation.y = t * .6;
  crewPose(t);
  familyPose(t);

  // phone UI + holograms
  drawPhoneUI(t);
  const appA = ss(7.0, 7.4, t) * (1 - ss(10.6, 11.0, t));
  const handW = new THREE.Vector3(); max.P.L.hand.getWorldPosition(handW);
  appHolo.m.position.copy(handW).add(v3(.05, .62, .15)); appHolo.m.lookAt(shot(t).pos);
  appHolo.m.scale.setScalar(.6 + .4 * backOut((t - 7.0) / .5)); drawAppHolo(t, appA);
  const liveA = ss(11.1, 11.5, t) * (1 - ss(13.3, 13.6, t));
  liveHolo.m.position.copy(CREW_HOME.luna).add(v3(-1.15, 1.1, .2)); liveHolo.m.rotation.y = .35; drawLiveHolo(t, liveA);
  const reelA = ss(13.5, 13.9, t) * (1 - ss(15.7, 16.0, t));
  reelHolo.m.position.copy(CREW_HOME.kai).add(v3(0, .6, -.3)); reelHolo.m.rotation.y = -.1; drawReelHolo(t, reelA);
  storyBubbles.forEach((s, i) => {
    const a = ss(15.9 + i * .08, 16.3 + i * .08, t) * (1 - ss(17.7, 18.0, t));
    const ang = i / 6 * Math.PI * 2 + (t - 15.8) * .8;
    s.position.copy(CREW_HOME.max).add(v3(Math.cos(ang) * 1.1, .95 + Math.sin(ang * 2) * .15, Math.sin(ang) * 1.1));
    s.material.opacity = a; s.scale.setScalar(.48 * (.5 + .5 * backOut((t - 15.9 - i * .08) / .5)) * (1 + .25 * (i === 2 ? ss(17.0, 17.3, t) : 0)));
  });
  hearts.forEach((h, i) => {
    const birth = 11.4 + i * .08 + rnd(i) * .1, age = t - birth, life = 1.7;
    const live = t < 13.6 ? 1 : 0;
    h.visible = age > 0 && age < life && live;
    if(h.visible){
      h.position.copy(CREW_HOME.luna).add(v3(-.5 + Math.sin(age * 3 + i) * .25, .9 + age * 1.1, .5 + rnd(i + 3) * .4));
      h.rotation.set(0, Math.sin(age * 2 + i) * .6, Math.sin(age * 4 + i) * .2);
      h.scale.setScalar(.12 * backOut(age / .3) * (1 - ss(life - .4, life, age)));
    }
  });
  // beam to Earth
  const bA = ss(18.5, 18.8, t) * (1 - ss(19.8, 20.0, t));
  beamMat.uniforms.uT.value = t; beamMat.uniforms.uA.value = bA;
  const bStart = v3(1.1, .2, 1.4), bEnd = earth.position.clone().add(v3(0, EARTH_R, 0).applyAxisAngle(v3(1, 0, 0), .55));
  const grow = easeOut((t - 18.5) / .6);
  const bE = vlerp(bStart, bEnd, grow), mid = vlerp(bStart, bE, .5), len = bStart.distanceTo(bE);
  beam.position.copy(mid); beam.scale.set(1, Math.max(len, .01), 1);
  beam.quaternion.setFromUnitVectors(v3(0, 1, 0), bE.clone().sub(bStart).normalize().negate());
  beam.visible = bA > 0;
  // logo assembly
  const asm = easeInOut((t - 24.9) / .9);
  logo.visible = t > 24.6;
  logo.position.copy(LOGO_AT); logo.rotation.y = Math.sin(t * .5) * .12 * ss(25.8, 27, t);
  logoPieces[0].position.set(-(1 - asm) * 4.5, (1 - asm) * 2.5, -(1 - asm) * 3); logoPieces[0].rotation.set((1 - asm) * 1.2, (1 - asm) * -2, (1 - asm) * .8);
  logoPieces[1].position.set((1 - asm) * 4.5, -(1 - asm) * 2.5, -(1 - asm) * 3); logoPieces[1].rotation.set(-(1 - asm) * 1.2, (1 - asm) * 2, -(1 - asm) * .8);
  logo.userData.mat.emissiveIntensity = .02 + .9 * Math.exp(-Math.pow((t - 25.8) * 3, 2));
  logo.position.y += (V ? 1.3 : .8);
  logo.scale.setScalar(.72);

  // camera
  const sh = shot(t);
  setFov(sh.fov);
  cam.position.copy(sh.pos); cam.lookAt(sh.look);
  if(sh.scene === village){ updateSnow(t, v3(cam.position.x, 0, cam.position.z - 8)); drawScreenUI(t);
    // live feed from orbit on the big screen
    liveCam.position.set(1.1, 1.4, 9.2); liveCam.lookAt(v3(1.1, .75, 2.6)); renderer.setRenderTarget(liveRT); renderer.render(space, liveCam); renderer.setRenderTarget(null);
  }
  renderPass.scene = sh.scene;
  bloom.strength = sh.scene === village ? .5 : .6;
  composer.render();

  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  // film grain + vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  overlay(t);
}

window.renderFrame = (i, q) => { render(i / FPS); return out.toDataURL('image/jpeg', q || .95); };
Promise.all(['IDLight', 'IDMed', 'IDBold'].map(f => document.fonts.load(`40px ${f}`))).then(() => document.fonts.load("40px 'Noto Color Emoji'", '🎄')).then(() => { window.READY = true; });
</script>
