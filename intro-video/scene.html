<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Go a little further — intro</title>
<style>
  @font-face { font-family: "IDLight";    src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Light.otf"); }
  @font-face { font-family: "IDRegular";  src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Regular.otf"); }
  @font-face { font-family: "IDSemiBold"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  #gl { position: absolute; left: -99999px; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<canvas id="out" width="1920" height="1080"></canvas>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uT;
#define PI 3.14159265

// ---------------------------------------------------------------- noise
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
vec2  h22(vec2 p){ float n = h21(p); return vec2(n, h21(p+n+17.17)); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), u.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<5;i++){ v += a*noise(p); p = m*p; a *= .5; }
  return v;
}
float h31(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),             h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm3(vec3 p){ float v = 0., a = .5; for(int i=0;i<5;i++){ v += a*noise3(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return v; }

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float ease(float a, float b, float t){ return smoothstep(a, b, t); }

// premium cyclic gradient: cyan -> violet -> magenta -> amber
vec3 grad(float x){
  x = fract(x)*4.;
  vec3 c0 = vec3(.05,.55,1.), c1 = vec3(.42,.12,1.), c2 = vec3(1.,.12,.50), c3 = vec3(1.,.52,.12);
  if(x < 1.) return mix(c0, c1, smoothstep(0.,1.,x));
  if(x < 2.) return mix(c1, c2, smoothstep(1.,2.,x));
  if(x < 3.) return mix(c2, c3, smoothstep(2.,3.,x));
  return mix(c3, c0, smoothstep(3.,4.,x));
}

// ---------------------------------------------------------------- stars
vec3 stars(vec2 p, float t){
  vec3 c = vec3(0);
  for(int L=0; L<3; L++){
    float fl = float(L);
    float s = 70. + fl*60.;
    vec2 q = p*s + fl*17.3;
    vec2 id = floor(q), f = fract(q) - .5;
    float r = h21(id + fl*7.1);
    if(r > .92){
      vec2 o = (h22(id + 3.1) - .5)*.7;
      float d = length(f - o);
      float b = (r - .92)/.08;
      float tw = .65 + .35*sin(t*(1.5 + r*4.) + r*60.);
      vec3 tint = mix(vec3(.7,.8,1.), vec3(1.,.9,.8), h21(id+9.));
      float dp = d*uRes.y/s;
      c += tint * (.25 + b*b) * tw * (exp(-dp*dp*.9) + .08*exp(-dp*.9)*b) * (1.3 - fl*.3);
    }
  }
  return c;
}

// ---------------------------------------------------------------- earth
// returns color; m = planet coverage
vec3 earth(vec2 p, vec2 c, float R, float spin, float t, float aur, float sun, float aSun, out float m){
  vec2 d = (p - c)/R;
  float r = length(d);
  float px = 1.5/(uRes.y*R);
  m = smoothstep(1. + px, 1. - px, r);
  vec3 col = vec3(0);
  float ang = atan(d.x, d.y);        // 0 at the top of the planet
  float hs = (r - 1.)*R;             // screen height above limb

  if(r < 1. + px){
    float z = sqrt(max(1. - r*r, 0.));
    vec3 n = vec3(d.x, d.y, z);
    // tilt the globe so the visible cap shows mid latitudes, then spin
    n.yz = rot(-1.05)*n.yz;
    n.xz = rot(spin)*n.xz;
    float cont = fbm3(n*2.1 + vec3(3.1, 1.2, 7.7));
    float land = smoothstep(.48, .53, cont);
    float coast = smoothstep(.47, .5, cont) - smoothstep(.5, .53, cont);
    float region = smoothstep(.4, .75, fbm3(n*7. + 11.));
    float pts  = pow(noise3(n*160.), 7.)*5. + pow(noise3(n*420. + 3.), 9.)*7.;
    float glow = pow(fbm3(n*28.), 3.)*.35;
    float city = (land*region*(pts + glow) + coast*region*pts*2.)*.9;
    float limb = smoothstep(0., .55, z);
    vec3 surf = mix(vec3(.004,.008,.022), vec3(.008,.011,.018), land);
    col = surf*(.5 + limb);
    col += vec3(1., .58, .24)*city*limb*(1. - sun*.6);
    // faint aurora reflection on the surface near the limb
    float band = smoothstep(.25, .8, fbm(vec2(ang*5. + t*.05, t*.08)));
    col += vec3(.1, .8, .45)*band*aur*exp(-(1. - r)*R*40.)*.25*smoothstep(1.1, .2, abs(ang));
    // sunrise: thin lit crescent along the limb
    float da = abs(ang - aSun);
    col += vec3(1., .55, .2)*sun*exp(-(1. - r)*R*70.)*exp(-da*2.2)*1.6;
    col += vec3(.3, .5, 1.)*sun*exp(-(1. - r)*R*25.)*exp(-da*1.2)*.25;
    col *= m;
  }

  // atmosphere rim: night airglow
  float up = max(hs, 0.);
  col += vec3(.18, .42, 1.)*exp(-abs(hs)*55.)*.35;
  col += vec3(.2, .95, .55)*exp(-pow((hs - .010)/.0035, 2.))*.28;   // green airglow line
  // sunlit atmosphere near the sun
  float da = abs(ang - aSun);
  vec3 atmC = mix(vec3(1., .5, .15), vec3(.25, .55, 1.), smoothstep(0., .5, da));
  col += atmC*sun*exp(-abs(hs)*mix(30., 60., smoothstep(0., .6, da)))*exp(-da*2.5)*(1.4);

  // aurora curtains above the limb
  if(aur > 0. && hs > -.01 && hs < .35){
    float base = .012 + .035*fbm(vec2(ang*2.5 + t*.03, 3.)) ;
    float v = hs - base;
    float band = smoothstep(.3, .75, fbm(vec2(ang*4.5 - t*.04, t*.07)));
    float rays = .55 + .45*noise(vec2(ang*380. + fbm(vec2(ang*10., t*.2))*20., t*.6));
    float prof = smoothstep(-.004, .006, v)*exp(-max(v, 0.)*mix(9., 22., band));
    vec3 ac = mix(vec3(.15, 1., .5), vec3(.75, .2, .95), smoothstep(.02, .14, v));
    ac = mix(ac, vec3(.2, .7, 1.), .25*smoothstep(.0, .4, ang));
    float span = smoothstep(1.2, .3, abs(ang + .15));
    col += ac*band*rays*prof*span*aur*1.3*(1. - m*.7);
  }
  return col;
}

// ---------------------------------------------------------------- fluid / streaks / particles
vec3 fluid(vec2 p, float t){
  p += vec2(-t*.06, .02*t);
  vec2 q = vec2(fbm(p*1.1 + vec2(0., t*.10)), fbm(p*1.1 + vec2(5.2, 1.3) - t*.08));
  vec2 r = vec2(fbm(p*1.4 + 3.2*q + vec2(1.7, 9.2) + t*.13), fbm(p*1.4 + 3.2*q + vec2(8.3, 2.8) - t*.11));
  float f = fbm(p*1.7 + 3.6*r);
  float fil = pow(smoothstep(.3, .9, f), 2.2);
  vec3 col = grad(r.x*2.2 + q.y*1.4 + t*.03)*(fil*2.6 + .06*f);
  col += grad(q.x + .5)*pow(smoothstep(.55, 1., r.y), 3.)*.35;
  return col;
}

vec3 streaks(vec2 p, float t, float amt){
  vec3 c = vec3(0);
  for(int i=0;i<4;i++){
    float fi = float(i);
    vec2 q = rot(-.32 + .07*fi)*p;
    float rows = 7. + fi*4.;
    float y = q.y*rows + fi*3.7;
    float id = floor(y), fy = fract(y) - .5;
    float rnd = h21(vec2(id, fi + 1.));
    if(rnd < .35) continue;
    float off = (h21(vec2(id, fi + 4.)) - .5)*.25;
    float w = .012 + .02*rnd;
    float dy = fy - off;
    float core = exp(-dy*dy/(w*w));
    float halo = exp(-abs(dy)/(w*3.5))*.16 + exp(-dy*dy/(w*w*40.))*.06;
    float speed = .7 + 1.6*rnd;
    float x = q.x*.9 - t*speed - rnd*13.;
    float seg = fract(x*.3);
    float len = .3 + .45*h21(vec2(id, fi + 7.));
    float tail = pow(smoothstep(0., len, seg), 2.)*smoothstep(len + .015, len, seg);
    c += grad(rnd*1.7 + fi*.23 + t*.02)*(core + halo)*tail*(.5 + rnd)*1.4;
  }
  return c*amt;
}

vec3 particles(vec2 p, float t){
  vec3 c = vec3(0);
  vec2 disp = (vec2(fbm(p*.7 + t*.08), fbm(p*.7 + 7. - t*.07)) - .5)*.18;
  for(int L=0;L<3;L++){
    float fl = float(L);
    float s = 5. + fl*6.;
    vec2 flow = vec2(t*(.06 + .05*fl), sin(t*.25 + fl)*.04);
    vec2 q = (p + flow + disp*(1. + fl*.5))*s + fl*11.;
    vec2 id = floor(q), f = fract(q) - .5;
    float r = h21(id + fl*3.);
    if(r < .45) continue;
    vec2 o = (h22(id + fl) - .5)*.6;
    float d = length(f - o);
    float size = (.015 + .05*h21(id + 5.))*(L == 0 ? 2.2 : 1.);
    float b = exp(-d*d/(size*size)) + exp(-d/(size*2.5))*.12;
    if(L == 0){ if(r < .75) continue; b = (smoothstep(size*1.3, size*1.15, d)*(.18 + .22*smoothstep(size*.6, size*1.2, d)) + exp(-d/(size*2.))*.04); } // soft bokeh
    b *= .55 + .45*sin(t*1.7 + r*40.);
    c += grad(r*2. + t*.04)*b*(.9/(1. + fl*.4));
  }
  return c;
}

// ---------------------------------------------------------------- sun / burst
vec3 sunGlare(vec2 p, vec2 s, float amt, float occl){
  vec2 d = p - s;
  float r = length(d);
  vec3 c = vec3(0);
  c += vec3(1., .92, .8)*exp(-r*r*2600.)*6.*occl;                 // core
  c += vec3(1., .7, .4)*.022/(r*r*30. + .02)*.35;                    // halo
  c += vec3(1., .6, .3)*exp(-r*5.)*.35;                             // wide warm bloom
  c += vec3(.55, .7, 1.)*exp(-abs(d.y)*260.)*exp(-abs(d.x)*1.6)*1.1; // anamorphic streak
  c += vec3(1., .8, .6)*exp(-abs(d.y)*60.)*exp(-abs(d.x)*3.)*.3;
  float a = atan(d.y, d.x);
  float rays = pow(noise(vec2(a*14., 1.)), 3.)*.6 + pow(noise(vec2(a*37., 4.)), 4.)*.5;
  c += vec3(1., .82, .6)*rays*exp(-r*3.5)*.55*step(-.02, d.y + .05);
  // ghost flares mirrored through the frame center
  for(int i=1;i<4;i++){
    float k = float(i)*.45;
    vec2 g = -s*k;
    float gr = length(p - g);
    c += grad(.1*float(i) + .55)*smoothstep(.06 + .03*float(i), .05 + .03*float(i), gr)*.025;
  }
  return c*amt;
}

// ---------------------------------------------------------------- main
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 p = (fc - .5*uRes)/uRes.y;
  vec2 uv = fc/uRes;
  float t = uT;
  vec3 col = vec3(0);

  // weights of the four acts
  float kWarp  = ease(4.4, 6.9, t);                      // earth -> streaks
  float wEarth = 1. - ease(5.6, 6.9, t);
  float wFlow  = ease(5.2, 6.6, t)*(1. - ease(15.0, 16.0, t));
  float wSun   = ease(15.2, 16.2, t);

  // ---- Act 1: earth at night
  if(wEarth > 0.){
    float te = t;
    vec2 pe = rot(-.07 + .012*te)*p;
    vec2 focus = vec2(-.05, -.18 + .01*te);
    float z = 1. + kWarp*kWarp*5.;
    pe = (pe - focus)/z + focus;
    float m;
    vec2 c = vec2(.06 - .01*te, -1.62 + .028*te);
    float R = 1.42 + .02*te;
    vec3 e = earth(pe, c, R, .5 + te*.018, te, 1., 0., 0., m);
    vec3 s = stars(pe*(1. + .01*te), te)*(1. - m);
    vec3 a1 = e + s;
    // hyperspace warp: radial light streaks from the aurora
    vec2 dv = p - focus;
    float rr = length(dv);
    float an = atan(dv.y, dv.x);
    float wl = pow(noise(vec2(an*55., log(rr + .001)*1.4 - t*7.)), 6.)*3.;
    wl *= smoothstep(.0, .25, rr);
    vec3 wc = mix(vec3(.2, 1., .55), grad(an*.3 + .2), kWarp);
    a1 += wc*wl*kWarp*kWarp*1.6;
    a1 *= 1. + kWarp*1.5;
    col += a1*wEarth;
  }

  // ---- Act 2 + 3: abstract fluid light, then text bed
  if(wFlow > 0.){
    float tf = t - 5.;
    float textBed = ease(9.4, 10.6, t);
    vec2 pf = rot(.04*sin(tf*.2))*p*(1.25 - .04*tf);
    vec3 f = fluid(pf, tf);
    vec3 s = streaks(pf, tf, mix(1., .35, textBed));
    vec3 pa = particles(pf, tf);
    vec3 a2 = f*mix(1., .38, textBed) + s + pa*mix(1., .7, textBed);
    // centre darkening behind the type
    a2 *= mix(1., smoothstep(.0, .7, length(p*vec2(.7, 1.6))), textBed*.75);
    // flash at the moment of entry
    a2 += grad(.1)*exp(-pow((t - 6.1)*2.2, 2.))*.15;
    col += a2*wFlow;
  }

  // ---- Act 4: sunrise over the horizon + light burst
  if(wSun > 0.){
    float ts = t - 15.2;
    float rise = ease(15.4, 17.4, t);
    float burst = ease(16.6, 17.25, t);
    vec2 c = vec2(0., -1.95 + .012*ts);
    float R = 1.62;
    vec2 sunP = vec2(0., c.y + R - .035 + rise*.07);
    float m;
    vec3 e = earth(p, c, R, 2.1 + ts*.02, t, .25*(1. - rise), .3 + rise*1.3, 0., m);
    vec3 s = stars(p, t)*(1. - m)*(1. - rise);
    // sun hidden behind the planet until it clears the limb
    float occl = smoothstep(-.012, .02, length(sunP - c) - R);
    vec3 g = sunGlare(p, sunP, .25 + rise*1.1 + burst*1.5, occl)*(1. - m*.92);
    vec3 a4 = e + s + g;
    // burst: expanding shock ring + full-frame bloom
    float br = length((p - sunP)*vec2(1., 1.25));
    float ringR = max(t - 16.75, 0.)*2.4;
    a4 += vec3(1., .85, .65)*exp(-pow((br - ringR)/.045, 2.))*burst*(1. - ease(17.3, 18., t))*.9;
    float wash = burst*(1. - .55*ease(17.3, 18., t));
    a4 += vec3(1., .86, .7)*wash*(1.6*exp(-br*1.1) + .55);
    a4 += vec3(1., .9, .8)*exp(-pow((t - 17.2)*3.2, 2.))*2.2;   // white flash peak
    col += a4*wSun;
  }

  // ---- post
  float expo = ease(0., 2.2, t);
  col *= expo;
  // filmic tone map
  col = 1. - exp(-col*1.15);
  col = pow(col, vec3(.88));
  // vignette
  vec2 vv = uv - .5;
  col *= 1. - .55*dot(vv, vv)*(1. - .7*ease(16.7, 17.3, t));
  // grain
  col += (h21(fc + fract(t*7.13)*517.) - .5)*.022;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}
</script>

<script>
const W = 1920, H = 1080, FPS = 30, DUR = 18;
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes'), uT = gl.getUniformLocation(prog, 'uT');
gl.viewport(0, 0, W, H);

const out = document.getElementById('out');
const ctx = out.getContext('2d');

const clamp01 = x => Math.max(0, Math.min(1, x));
const ss = (a, b, x) => { const t = clamp01((x - a)/(b - a)); return t*t*(3 - 2*t); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);

// draw a word with per-letter tracking, centred at (cx, cy)
function trackedText(str, cx, cy, font, size, tracking){
  ctx.font = `${size}px ${font}`;
  const chars = [...str];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + tracking*size*(chars.length - 1);
  let x = cx - total/2;
  ctx.textBaseline = 'middle';
  chars.forEach((ch, i) => { ctx.fillText(ch, x, cy); x += widths[i] + tracking*size; });
  return { x0: cx - total/2, w: total };
}

function drawWord(str, t, tin, tout, opts){
  const a = ss(tin, tin + opts.inDur, t) * (1 - ss(tout, tout + opts.outDur, t));
  if(a <= 0.001) return;
  const pin = easeOut((t - tin)/opts.inDur);
  const pout = ss(tout, tout + opts.outDur, t);
  const tracking = opts.track1 + (opts.track0 - opts.track1)*(1 - pin) + pout*opts.trackOut;
  const blur = (1 - pin)*opts.blur + pout*opts.blur*.8;
  const dy = (1 - pin)*opts.rise - pout*opts.rise*.5;
  const scale = opts.scale0 + (1 - opts.scale0)*pin + pout*.02;
  const cx = W/2, cy = H/2 + opts.y + dy;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
  ctx.globalAlpha = a;
  ctx.filter = blur > .1 ? `blur(${blur.toFixed(2)}px)` : 'none';
  // soft glow pass
  ctx.shadowColor = opts.glow; ctx.shadowBlur = 40;
  ctx.fillStyle = opts.color;
  const m = trackedText(str, cx, cy, opts.font, opts.size, tracking);
  ctx.shadowBlur = 0;
  ctx.restore();
  return m;
}

// light sweep across the hero line
function sweep(str, t, t0, dur, opts){
  const k = (t - t0)/dur;
  if(k < 0 || k > 1) return;
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d');
  o.font = `${opts.size}px ${opts.font}`; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  const chars = [...str]; const ws = chars.map(c => o.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + opts.track1*opts.size*(chars.length - 1);
  let x = W/2 - total/2; const cy = H/2 + opts.y;
  chars.forEach((c, i) => { o.fillText(c, x, cy); x += ws[i] + opts.track1*opts.size; });
  o.globalCompositeOperation = 'source-in';
  const sx = W/2 - total/2 - 300 + (total + 600)*k;
  const g = o.createLinearGradient(sx - 160, 0, sx + 160, 0);
  g.addColorStop(0, 'rgba(255,240,220,0)');
  g.addColorStop(.5, 'rgba(255,248,235,1)');
  g.addColorStop(1, 'rgba(255,240,220,0)');
  o.fillStyle = g; o.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.sin(k*Math.PI)*.9;
  ctx.shadowColor = 'rgba(255,220,180,.9)'; ctx.shadowBlur = 30;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

function drawText(t){
  drawWord('a little', t, 9.9, 11.55, {
    inDur: 1.0, outDur: .45, font: 'IDLight', size: 92, track0: .55, track1: .14, trackOut: .2,
    blur: 14, rise: 18, scale0: 1.0, y: 0, color: 'rgba(236,240,255,1)', glow: 'rgba(140,170,255,.55)' });
  drawWord('further', t, 11.75, 13.25, {
    inDur: .95, outDur: .4, font: 'IDRegular', size: 104, track0: .5, track1: .1, trackOut: .2,
    blur: 14, rise: -18, scale0: 1.0, y: 0, color: 'rgba(255,244,236,1)', glow: 'rgba(255,150,190,.55)' });
  const hero = { inDur: 1.1, outDur: .55, font: 'IDSemiBold', size: 116, track0: .22, track1: .015, trackOut: .12,
    blur: 18, rise: 0, scale0: 1.08, y: -40, color: 'rgba(255,255,255,1)', glow: 'rgba(255,200,160,.6)' };
  drawWord('Go a little further.', t, 13.5, 16.85, hero);
  sweep('Go a little further.', t, 14.55, 1.25, hero);
}

window.renderFrame = function(i, quality){
  const t = i / FPS;
  gl.uniform2f(uRes, W, H); gl.uniform1f(uT, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(glc, 0, 0);
  drawText(t);
  return out.toDataURL('image/jpeg', quality || .96);
};
window.ready = Promise.all(['IDLight', 'IDRegular', 'IDSemiBold'].map(f => document.fonts.load(`100px ${f}`)));
